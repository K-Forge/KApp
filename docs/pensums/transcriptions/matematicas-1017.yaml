declaredHours: 195   # printed on the brochure; the coded grid adds up to 197 (see notes)
notes:
  - "Checked cell by cell against the brochure plan-estudios-matematicas-konrad.pdf, which prints the same plan without codes."
  - "Práctica Profesional: the coded grid prints 24 contact hours, the brochure 22. That is the whole 197 vs 195 difference."
  - "Enseñanza de las Matemáticas: 2 credits here; the brochure prints 3, but its own semester VIII total (16) only adds up with 2."
  - "Matemática fundamental prints HTI 3, Metodología de la Investigación HTI 3 and Trabajo de Grado HTI 4, which break credits x 3 = HTD + HTI. Credits and HTD agree with the brochure and are kept."
  - "Énfasis I -> II -> III are drawn as a chain, but all three are elective slots and the model only accepts prerequisites that are course codes, so the chain is not stored."
  - "The brochure calls Electiva 1-4 'Electiva Profesional I-IV'."
