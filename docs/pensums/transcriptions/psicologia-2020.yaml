notes:
  - "The grid prints 151 credits and 174 contact hours, per area (37, 25, 21, 50, 18) and per semester; the extraction adds up to all of them."
  - "Both professional practices print 4,5 contact hours, and the seed stores the half as printed."
  - "The printed semester hour totals (21, 21, 23, 21, 24, 20, 19, 15, 11) add up to 175, one more than the 174 printed as the overall total: each of the two semesters holding a 4,5 practice is printed rounded up (14,5 as 15 and 10,5 as 11). The items themselves add up to the printed 174."
  - "Connectors are plain lines without arrowheads; each one runs from an earlier semester to a later one, which gives the direction."
  - "Dashed boxes mark 'clases con proyecto integrador'; the model has no field for it."
  - "Electiva III: the rendered page clips the P of P3805; the text layer has it."
