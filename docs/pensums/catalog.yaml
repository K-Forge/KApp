# Which transcription becomes which pensum, under which codes.
#
# Only the Ingeniería de Sistemas program code (506) and the three printed plan numbers
# (1015, 1017, 1020) come from the university. Every other programCode, pensumCode and
# course code below is KApp's own placeholder: readable, stable, and marked in the seed by
# an empty sinuCode, so nobody mistakes it for an institutional one. Replace them here, run
# tools/build_seed.py, and the seed follows.
#
# ACTIVE plans are the four printed with course codes. The brochures load as DRAFT: their
# course codes are placeholders, and a student pinned to a placeholder code would lose that
# pin the day the real codes arrive.
- file: ingenieria-de-sistemas-1015.yaml
  programCode: "506"
  pensumCode: "1015"
  status: ACTIVE
- file: matematicas-1017.yaml
  programCode: MATEMATICAS
  pensumCode: "1017"
  status: ACTIVE
- file: ingenieria-industrial-1020.yaml
  programCode: ING-INDUSTRIAL
  pensumCode: "1020"
  status: ACTIVE
- file: psicologia-2020.yaml
