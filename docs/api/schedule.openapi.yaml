openapi: 3.1.0

info:
  title: KApp Schedule API
  version: 2.0.0
  summary: A person's class timetable for one academic period, read from SINU.
  description: |
    The class timetable of a student, or of a professor, at Fundación Universitaria Konrad Lorenz,
    **read from SINU**. KApp shows it and never changes it: choosing courses, changing a group or a
    room is done in SINU, through the university, and shows up here on its own. Nothing in this
    API writes.

    Until the university opens SINU, a test adapter serves invented timetables of the same shape,
    and `source` says so on every schedule.

    ## Model

    The shape is SINU's own, as its timetable report (`PACR42_GWT`) prints it.

    A weekly class slot is **not** one continuous date range. A single meeting such as "Mondays
    18:15-20:30" is taught across several **disjoint** date ranges, each with its own classroom,
    and some of those ranges have no classroom assigned at all. The model therefore nests three
    levels:

    ```
    Schedule        one per person per academic period
      └─ Section        a course and the group the person is in (or teaches)
           └─ Meeting       a weekly day + time slot
                └─ MeetingPeriod   a date range, with the room in force during it
    ```

    For example, a Monday 18:15-20:30 class:

    | Date range              | Room   |
    |-------------------------|--------|
    | 2026-07-27 → 2026-08-10 | 405    |
    | 2026-08-24 → 2026-09-14 | 405    |
    | 2026-09-21 → 2026-09-28 | *none* |
    | 2026-10-19 → 2026-11-30 | 405    |

    ## Blocks

    SINU schedules in **blocks of 45 minutes**, always. Every meeting lasts a whole number of
    blocks, and `blocks` says how many: 18:15-21:15 is four. SINU's hours are these blocks too, so
    a course of four blocks a week has `totalHours` 64 over its 16 weeks.

    ## Resolved views

    `GET /api/schedule/me/day` and `GET /api/schedule/me/week` do the period resolution server-side:
    they walk every meeting's `periods[]`, keep only the meetings that actually occur on the
    requested date, and report the room **in force on that date** — which may be `null`. Clients
    render the home screen and the day / 2-day / week views straight from these, and never have to
    reimplement the resolution themselves.

    ## Rooms and buildings

    SINU names a room by its number (`"302"`) and the building by its *sede*: in SINU each
    building is a sede. The same number exists in more than one building — the Edificio Central
    and Bienestar Institucional both have a `301` — so a room is only identified by the two
    together.

    Each section carries the `sede` as SINU writes it and the KApp `buildingCode` it maps to, and
    each date range its `room`. With both a client opens the classroom on the map:
    `GET /api/map/spaces/{room}?buildingCode={buildingCode}`. `buildingCode` is `null` for a sede
    nobody has mapped to a building yet, in the portal (`Building.sinuSedes`).

    ## Explicit nulls

    Fields that may be null (`subgroup`, `room`, `buildingCode`) are **always present**, so that
    "no room assigned" is never confused with "room unknown".

    ## Access control

    Every operation requires a valid JWT and reads the caller's own timetable: a student's, the
    sections they take; a professor's, the sections they teach. Allowed roles are `ROLE_STUDENT`
    and `ROLE_PROFESSOR`. No route reads somebody else's timetable, administrators included.

    **`ROLE_STAFF` and `ROLE_GUEST` are forbidden everywhere in this service**: they take and teach
    no classes. Any such token is rejected with `403 Forbidden`.

servers:
  - url: http://localhost:8080
    description: Local API gateway

security:
  - bearerAuth: []

tags:
  - name: Schedule
    description: The caller's timetable for one period, as SINU has it.
  - name: Agenda
    description: Resolved day and week views, with the room in force on each date.

paths:
  /api/schedule/me:
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT, ROLE_PROFESSOR]
      operationId: getMySchedule
      summary: Get the caller's schedule for a period
      description: |
        Returns the caller's timetable as SINU has it, with every section, meeting and meeting
        period nested inside it. When `period` is omitted the current period is returned.
      tags: [Schedule]
      parameters:
        - $ref: '#/components/parameters/PeriodQueryOptional'
      responses:
        '200':
          description: The caller's schedule for the requested period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
              examples:
                semester20262:
                  $ref: '#/components/examples/FullSchedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: SINU has no timetable for the caller in that period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                noScheduleForPeriod:
                  summary: No timetable in the requested period
                  value:
                    timestamp: '2026-09-21T18:20:11.482Z'
                    status: 404
                    error: Not Found
                    message: No schedule found for period 20261
                    path: /api/schedule/me

  /api/schedule/me/periods:
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT, ROLE_PROFESSOR]
      operationId: listMySchedulePeriods
      summary: List the periods the caller has a schedule for
      description: |
        Returns one entry per period SINU has a timetable for, newest period first. Clients use it
        to populate the period switcher without downloading every schedule.
      tags: [Schedule]
      responses:
        '200':
          description: Periods the caller has schedules for, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchedulePeriodSummary'
              examples:
                threePeriods:
                  summary: The current period and two past ones
                  value:
                    - period: '20262'
                      active: true
                      sectionCount: 6
                    - period: '20261'
                      active: false
                      sectionCount: 6
                    - period: '20252'
                      active: false
                      sectionCount: 5
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/schedule/me/day:
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT, ROLE_PROFESSOR]
      operationId: getMyDay
      summary: Get the caller's classes on one date
      description: |
        Resolves which meetings actually take place on `date`. For every meeting in the caller's
        schedule the server checks the meeting's `dayOfWeek` against the weekday of `date`, then
        walks the meeting's `periods[]` for a range that contains `date` (both endpoints inclusive).
        Matching meetings are returned with the room in force during that range, which may be
        `null`.

        The result is sorted by `startTime` ascending. An empty array means no classes that day.

        **This is the endpoint the mobile home screen calls.**
      tags: [Agenda]
      parameters:
        - $ref: '#/components/parameters/DateQueryRequired'
      responses:
        '200':
          description: The classes taking place on that date, sorted by start time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassOccurrence'
              examples:
                classWithRoom:
                  summary: Monday 2026-08-24 — resolves to room 405 of the Edificio Central
                  value:
                    - sectionCode: '4127'
                      sinuCode: '59035'
                      pensumItemCode: '59035'
                      courseName: DESARROLLO DE APLICACIONES MÓVILES
                      group: '51'
                      professor: GÓMEZ RESTREPO LAURA MARCELA
                      startTime: '18:15'
                      endTime: '20:30'
                      blocks: 3
                      sede: Sede Principal
                      buildingCode: EC
                      room: '405'
                      color: '#539392'
                classWithoutRoom:
                  summary: Monday 2026-09-21 — same class, but that range has no room
                  value:
                    - sectionCode: '4127'
                      sinuCode: '59035'
                      pensumItemCode: '59035'
                      courseName: DESARROLLO DE APLICACIONES MÓVILES
                      group: '51'
                      professor: GÓMEZ RESTREPO LAURA MARCELA
                      startTime: '18:15'
                      endTime: '20:30'
                      blocks: 3
                      sede: Sede Principal
                      buildingCode: EC
                      room: null
                      color: '#539392'
                noClasses:
                  summary: A date inside a gap between two ranges
                  value: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: SINU has no timetable for the caller in the current period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                noActiveSchedule:
                  summary: No timetable this period
                  value:
                    timestamp: '2026-09-21T06:02:44.117Z'
                    status: 404
                    error: Not Found
                    message: No active schedule found
                    path: /api/schedule/me/day

  /api/schedule/me/week:
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT, ROLE_PROFESSOR]
      operationId: getMyWeek
      summary: Get the caller's classes for one week
      description: |
        Resolves a whole week at once, using exactly the same rule as
        `GET /api/schedule/me/day` applied to each of the seven dates.

        `date` may be **any** date inside the wanted week; the server snaps it to the Monday of that
        week. Weeks run Monday to Sunday. When `date` is omitted the current week is returned.

        All seven day keys are always present; a day with no classes carries an empty array. Each
        day's classes are sorted by `startTime` ascending. `weekStart` and `weekEnd` tell the client
        which calendar dates the seven buckets correspond to, so day, 2-day and week views can all
        be rendered from a single call.
      tags: [Agenda]
      parameters:
        - $ref: '#/components/parameters/DateQueryOptional'
      responses:
        '200':
          description: The caller's classes for that week, grouped by day of week
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekAgenda'
              examples:
                weekOf20260921:
                  summary: Week of 2026-09-21, with Monday's class missing its room
                  value:
                    weekStart: '2026-09-21'
                    weekEnd: '2026-09-27'
                    days:
                      MONDAY:
                        - sectionCode: '4127'
                          sinuCode: '59035'
                          pensumItemCode: '59035'
                          courseName: DESARROLLO DE APLICACIONES MÓVILES
                          group: '51'
                          professor: GÓMEZ RESTREPO LAURA MARCELA
                          startTime: '18:15'
                          endTime: '20:30'
                          blocks: 3
                          sede: Sede Principal
                          buildingCode: EC
                          room: null
                          color: '#539392'
                      TUESDAY: []
                      WEDNESDAY:
                        - sectionCode: '4133'
                          sinuCode: '48022'
                          pensumItemCode: '48022'
                          courseName: INGENIERÍA DE SOFTWARE II
                          group: '51'
                          professor: MARTÍNEZ ACOSTA JORGE ENRIQUE
                          startTime: '18:15'
                          endTime: '21:15'
                          blocks: 4
                          sede: Sede Principal
                          buildingCode: EC
                          room: '508'
                          color: '#C9D329'
                      THURSDAY: []
                      FRIDAY: []
                      SATURDAY:
                        - sectionCode: '4140'
                          sinuCode: '56201'
                          pensumItemCode: '56201'
                          courseName: METODOLOGÍA DE INVESTIGACIÓN
                          group: '51'
                          professor: RAMÍREZ SALAZAR DIANA PATRICIA
                          startTime: '07:00'
                          endTime: '08:30'
                          blocks: 2
                          sede: Bienestar Institucional
                          buildingCode: BI
                          room: '301'
                          color: '#522567'
                      SUNDAY: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: SINU has no timetable for the caller in the current period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                noActiveSchedule:
                  summary: No timetable this period
                  value:
                    timestamp: '2026-09-21T06:02:44.117Z'
                    status: 404
                    error: Not Found
                    message: No active schedule found
                    path: /api/schedule/me/week

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          description: >-
            When the service produced this error, in UTC. Not when the request was sent.
          type: string
          format: date-time
        status:
          description: >-
            The HTTP status, repeated in the body so a logged response is self-contained.
          type: integer
          example: 400
        error:
          description: >-
            The status's standard name - `Bad Request`, `Conflict`. For developers, not for users.
          type: string
          example: Bad Request
        message:
          description: >-
            One sentence a person can act on. This is the line worth surfacing in a UI.
          type: string
        path:
          description: >-
            The path that produced the error, so a log line identifies itself.
          type: string
        details:
          description: >-
            Field-by-field reasons, when there are any. `field` names what was wrong and `issue` says what
            about it - this is what a form binds its per-field errors to.
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }

    AcademicPeriod:
      type: string
      description: |
        The university's own academic period code: four digits for the year, then `1` or `2` for the
        semester. `"20262"` is the second semester of 2026.
      pattern: '^\d{4}[12]$'
      example: '20262'

    DayOfWeek:
      type: string
      description: The weekday a meeting repeats on. Weeks run Monday to Sunday.
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
      example: MONDAY

    LocalTime:
      type: string
      description: A time of day as `HH:mm` on a 24-hour clock. No seconds, no timezone.
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      example: '18:15'

    RoomCode:
      type: [string, 'null']
      description: |
        The room, as SINU names it — usually a number whose first digit is the floor: `"302"` is on
        the third floor. It identifies a room only together with the section's building: the same
        number exists in more than one building.

        `null` means no classroom has been assigned for that stretch of the semester. It is a real,
        common state in SINU, not a missing value, and clients must render it.
      maxLength: 20
      example: '405'

    MeetingPeriod:
      type: object
      description: |
        One contiguous stretch of the semester during which a weekly meeting is taught in a given
        room. Both endpoints are **inclusive**, and a single-day range has `from` equal to `to`.

        A meeting's periods are disjoint and never overlap each other; the gaps between them are
        the weeks the class does not meet.
      required: [from, to, room]
      properties:
        from:
          type: string
          format: date
          description: First date of the range, inclusive. Falls on the meeting's `dayOfWeek`.
          example: '2026-08-24'
        to:
          type: string
          format: date
          description: |
            Last date of the range, inclusive. Falls on the meeting's `dayOfWeek`, and is never
            earlier than `from`.
          example: '2026-09-14'
        room:
          $ref: '#/components/schemas/RoomCode'

    Meeting:
      type: object
      description: |
        One weekly day + time slot of a section, together with the date ranges over which it is
        actually taught and the room in force during each of them.
      required: [dayOfWeek, startTime, endTime, blocks, periods]
      properties:
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeek'
        startTime:
          allOf:
            - $ref: '#/components/schemas/LocalTime'
          description: When the class starts. Inclusive.
        endTime:
          allOf:
            - $ref: '#/components/schemas/LocalTime'
          description: When the class ends. Always later than `startTime`.
        blocks:
          type: integer
          minimum: 1
          description: How many 45-minute blocks the class lasts, which is how SINU schedules it.
          example: 3
        periods:
          type: array
          description: |
            The disjoint date ranges over which this weekly slot is taught, in ascending order of
            `from`.
          minItems: 1
          items:
            $ref: '#/components/schemas/MeetingPeriod'

    Section:
      type: object
      description: |
        One course the person takes, or teaches, during the period, in one group, with its weekly
        meetings — what SINU's report lists as an *asignatura* with its *grupo*.
      required:
        - sectionCode
        - sinuCode
        - pensumItemCode
        - courseName
        - level
        - credits
        - totalHours
        - group
        - subgroup
        - professor
        - sede
        - buildingCode
        - startDate
        - endDate
        - color
        - meetings
      properties:
        sectionCode:
          type: string
          description: SINU's identifier of this course and group in the period — the report's `Cod.`.
          maxLength: 20
          example: '4127'
        sinuCode:
          type: string
          description: |
            The course code as SINU carries it. The same `sinuCode` the semáforo shows, so a client
            can tell which item of the student's semáforo this class is.
          maxLength: 20
          example: '59035'
        pensumItemCode:
          type: [string, 'null']
          description: |
            The matching item of the student's pensum, as the semáforo addresses it. `null` for a
            course outside the student's pensum, and always for a professor's timetable.
          maxLength: 30
          example: '59035'
        courseName:
          type: string
          description: The course name, as SINU writes it.
          example: DESARROLLO DE APLICACIONES MÓVILES
        level:
          type: integer
          description: The semester the course belongs to in the study plan.
          minimum: 1
          maximum: 12
          example: 8
        credits:
          type: integer
          description: Academic credits.
          minimum: 0
          example: 3
        totalHours:
          type: integer
          description: |
            Total hours of the course over the semester, as SINU prints them. A SINU hour is a
            45-minute block: weekly blocks times 16.
          minimum: 0
          example: 48
        group:
          type: string
          description: The group code.
          example: '51'
        subgroup:
          type: [string, 'null']
          description: Subgroup code, or `null` when the group is not subdivided.
          example: null
        professor:
          type: string
          description: |
            The professor's full name, in SINU's own uppercase surname-first form. On a professor's
            own timetable, their own name.
          example: GÓMEZ RESTREPO LAURA MARCELA
        sede:
          type: string
          description: The sede as SINU writes it. In SINU each building is a sede.
          example: Sede Principal
        buildingCode:
          type: [string, 'null']
          description: |
            The KApp building that sede maps to, for the map. `null` when nobody has mapped that
            sede to a building yet.
          example: EC
        startDate:
          type: string
          format: date
          description: |
            First day of the course over the whole semester, inclusive. Equal to the earliest
            `from` across all of this section's meeting periods.
          example: '2026-07-27'
        endDate:
          type: string
          format: date
          description: |
            Last day of the course over the whole semester, inclusive. Equal to the latest `to`
            across all of this section's meeting periods.
          example: '2026-11-30'
        color:
          type: string
          description: |
            The colour the client paints this course with, as `#RRGGBB`. KApp assigns it from the
            six non-pink colours of the palette, and a course keeps its colour from one period to
            the next.
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#539392'
        meetings:
          type: array
          description: The weekly slots this course is taught in.
          items:
            $ref: '#/components/schemas/Meeting'

    Schedule:
      type: object
      description: |
        A person's whole timetable for one academic period, as SINU has it.
      required: [userId, period, programCode, pensumCode, level, active, source, readAt, sections]
      properties:
        userId:
          type: string
          description: >-
            Identifier of the KApp user, taken from the JWT `sub` claim. An opaque string, never
            parsed as a number.
          example: '507f1f77bcf86cd799439011'
        period:
          $ref: '#/components/schemas/AcademicPeriod'
        programCode:
          type: [string, 'null']
          description: Code of the student's academic program. `null` on a professor's timetable.
          example: '506'
        pensumCode:
          type: [string, 'null']
          description: The study plan (pensum) the student follows. `null` on a professor's timetable.
          example: '1015'
        level:
          type: [integer, 'null']
          description: The semester the student is in during this period. `null` on a professor's timetable.
          minimum: 1
          maximum: 12
          example: 8
        active:
          type: boolean
          description: |
            Whether this is the current period: the one served when `period` is omitted.
          example: true
        source:
          type: string
          enum: [SINU, TEST]
          description: |
            Where this came from. `TEST` is the adapter that serves invented timetables while the
            university has not opened SINU; a client shows that the data is not real.
          example: SINU
        readAt:
          type: string
          format: date-time
          description: When this was read from SINU. KApp keeps it for a few minutes at most.
          example: '2026-10-05T14:32:11Z'
        sections:
          type: array
          description: The courses the person takes, or teaches, during this period.
          items:
            $ref: '#/components/schemas/Section'

    SchedulePeriodSummary:
      type: object
      description: One row of the period switcher.
      required: [period, active, sectionCount]
      properties:
        period:
          $ref: '#/components/schemas/AcademicPeriod'
        active:
          type: boolean
          description: Whether this is the current period.
          example: true
        sectionCount:
          type: integer
          description: How many courses the timetable for that period holds.
          minimum: 0
          example: 6

    ClassOccurrence:
      type: object
      description: |
        One class actually taking place on one concrete date, already resolved by the server: the
        meeting matched the date's weekday, one of its periods contained the date, and `room` is the
        room in force during that period.
      required:
        - sectionCode
        - sinuCode
        - pensumItemCode
        - courseName
        - group
        - professor
        - startTime
        - endTime
        - blocks
        - sede
        - buildingCode
        - room
        - color
      properties:
        sectionCode:
          type: string
          description: The section this class belongs to, for drilling into the course detail.
          example: '4127'
        sinuCode:
          type: string
          example: '59035'
        pensumItemCode:
          type: [string, 'null']
          example: '59035'
        courseName:
          type: string
          example: DESARROLLO DE APLICACIONES MÓVILES
        group:
          type: string
          example: '51'
        professor:
          type: string
          example: GÓMEZ RESTREPO LAURA MARCELA
        startTime:
          $ref: '#/components/schemas/LocalTime'
        endTime:
          $ref: '#/components/schemas/LocalTime'
        blocks:
          type: integer
          minimum: 1
          description: How many 45-minute blocks the class lasts.
          example: 3
        sede:
          type: string
          example: Sede Principal
        buildingCode:
          type: [string, 'null']
          description: The KApp building of the sede, or `null` while the sede is not mapped.
          example: EC
        room:
          $ref: '#/components/schemas/RoomCode'
        color:
          description: >-
            RGB hex the client draws this class in, assigned by KApp so a week is readable at a
            glance.
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#539392'

    WeekAgenda:
      type: object
      description: |
        One Monday-to-Sunday week of resolved classes. All seven day keys are always present, and a
        day with no classes carries an empty array.
      required: [weekStart, weekEnd, days]
      properties:
        weekStart:
          type: string
          format: date
          description: The Monday of the returned week, inclusive.
          example: '2026-09-21'
        weekEnd:
          type: string
          format: date
          description: The Sunday of the returned week, inclusive.
          example: '2026-09-27'
        days:
          type: object
          description: Classes grouped by weekday, each list sorted by `startTime` ascending.
          required: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
          additionalProperties: false
          properties:
            MONDAY:
              type: array
              items:
                $ref: '#/components/schemas/ClassOccurrence'
            TUESDAY:
              type: array
              items:
                $ref: '#/components/schemas/ClassOccurrence'
            WEDNESDAY:
              type: array
              items:
                $ref: '#/components/schemas/ClassOccurrence'
