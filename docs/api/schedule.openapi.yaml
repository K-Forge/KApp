      example: '20262'

    DateQueryRequired:
      name: date
      in: query
      required: true
      description: The calendar date to resolve, as `YYYY-MM-DD`.
      schema:
        type: string
        format: date
      example: '2026-08-24'

    DateQueryOptional:
      name: date
      in: query
      required: false
      description: |
        Any date inside the wanted week, as `YYYY-MM-DD`; the server snaps it to that week's Monday.
        When omitted, the current week is returned.
      schema:
        type: string
        format: date
      example: '2026-09-21'

