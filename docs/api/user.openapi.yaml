openapi: 3.1.0

info:
  title: KApp User API
  version: 1.0.0
  summary: Profile service for the KApp platform.
  description: |
    Profile service for KApp, the mobile application of Fundación Universitaria
    Konrad Lorenz built by the K-Forge club.

    ## Service boundary

    This service owns **profiles only**: names, avatar, roles as the Auth API grants them, and
    activation state. It never stores passwords, password hashes or verification tokens, and it
    issues no tokens. Credentials belong to the Auth API.

    **It stores no identity document, no phone number and no student code.** Names come from
    Microsoft at sign-in. The academic block — program, pensum and level — is read from SINU for
    the person themselves, never stored here, and never shown to anybody else.

    The two services are joined by the account id: the `id` of a profile here is
    the `sub` claim of the tokens the Auth API signs.

    ## Authentication

    Every public-facing endpoint expects `Authorization: Bearer <accessToken>`,
    validated at the gateway against the Auth API JWKS. `/internal/users` is the single
    exception: it is service-to-service and uses the `X-Internal-Token` header instead.

    ## Roles

    A person holds **one profile role** and **any number of permissions**, all in `roles`. The
    profile role decides what the app shows; a permission opens a part of the admin portal.

    | Role | Kind | Reach here |
    |---|---|---|
    | `ROLE_STUDENT` | profile | Own profile, with the academic block. |
    | `ROLE_PROFESSOR` | profile | Own profile. |
    | `ROLE_STAFF` | profile | Own profile. An administrative employee. |
    | `ROLE_ADMIN` | permission | Also the directory and activation state. |
    | `ROLE_RECEPTION`, `ROLE_MAINTENANCE`, `ROLE_MODERATION`, `ROLE_WELLBEING` | permission | Nothing more here. |
    | `ROLE_GUEST` | — | **Nothing here.** A visitor with a day pass has no account. |

    Every operation states the roles it accepts. Authorization is enforced
    server side; the roles a client reads from its token are only a hint for
    hiding interface it cannot reach.

    ## Conventions

    - Program code `506` is Ingeniería de Sistemas; pensum `1015` is its current pensum
      version.
    - Errors share the `ApiError` shape across every KApp service.

    ## Mocking

    This document is served by Prism. Operations that carry more than one named
    example return the first by default; ask for a specific one with the
    `Prefer: example=professor` request header.
  contact:
    name: K-Forge
    url: https://github.com/K-Forge

servers:
  - url: http://localhost:8080
    description: Local API gateway

security:
  - bearerAuth: []

tags:
  - name: Profile
    description: Self-service access to the authenticated user's own profile.
  - name: Administration
    description: Directory and activation management. Restricted to `ROLE_ADMIN`.
  - name: Internal
    description: Service-to-service endpoints, unreachable from outside the Docker network.

paths:
  /api/users/me:
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT, ROLE_PROFESSOR, ROLE_STAFF, ROLE_ADMIN]
      operationId: getMyProfile
      summary: Get the authenticated user's profile
      description: |
        Returns the profile of the account the bearer token belongs to,
        resolved from the token's `sub` claim. No user id is accepted in the
        request, so one account can never read another through this path.

        For a student, `academic` carries their program, pensum and level as SINU has them,
        read for this call. It is `null` for everybody else.

        `ROLE_GUEST` is refused with `403`: a visitor holds a day pass, not an account.
      tags: [Profile]
      responses:
        '200':
          description: The authenticated user's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              examples:
                student:
                  $ref: '#/components/examples/StudentProfile'
                professor:
                  $ref: '#/components/examples/ProfessorProfile'
                staffAdmin:
                  $ref: '#/components/examples/StaffAdminProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    patch:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT, ROLE_PROFESSOR, ROLE_STAFF, ROLE_ADMIN]
      operationId: updateMyProfile
      summary: Update the authenticated user's profile
      description: |
        Changes the caller's own avatar. The target is always the token's `sub`, so no one can edit
        another account here.

        **Nothing else is editable.** Names come from Microsoft at every sign-in, `email` is owned
        by the Auth API, roles and `active` are administrative, and `academic` is SINU's. Sending
        any of them is rejected with `400` rather than being silently dropped, so a client that
        round-trips a full profile object gets a clear error instead of a surprise.
      tags: [Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
            examples:
              newAvatar:
                summary: Set a profile picture
                value:
                  avatarUrl: https://cdn.kapp.konradlorenz.edu.co/avatars/3f8a1c2e.jpg
              noAvatar:
                summary: Remove it
                value:
                  avatarUrl: null
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              examples:
                student:
                  $ref: '#/components/examples/StudentProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users:
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_ADMIN]
      operationId: listUsers
      summary: List and search user profiles
      description: |
        Returns a page of the directory, newest account first.

        **Access: `ROLE_ADMIN` only.** Any other authenticated role receives
        `403`. This is the only endpoint that lists accounts other than the
        caller's own, which is why it is restricted.

        The directory carries names, e-mail, roles and activation state, and **nothing
        academic**: an administrator manages accounts, not records.

        Filters combine with AND: `role`, `active` and `q` narrow the same
        result set. Omitting all three lists every account.
      tags: [Administration]
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page index.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
            example: 0
        - name: size
          in: query
          required: false
          description: Profiles per page. Values above 100 are rejected with `400`.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
            example: 20
        - name: role
          in: query
          required: false
          description: Return only accounts holding this role, among others.
          schema:
            $ref: '#/components/schemas/Role'
        - name: active
          in: query
          required: false
          description: |
            Return only active (`true`) or only deactivated (`false`) accounts.
            Omit to return both.
          schema:
            type: boolean
            example: true
        - name: q
          in: query
          required: false
          description: |
            Free-text search, case and accent insensitive, matched as a partial
            against first name, last name and e-mail.
          schema:
            type: string
            minLength: 1
            maxLength: 100
            example: perez
      responses:
        '200':
          description: A page of the directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse'
              example:
                content:
                  - id: 3f8a1c2e-7b4d-4e5a-9c6f-2d1b8e0a4c73
                    email: pepito.perez@konradlorenz.edu.co
                    firstName: Pepito
                    lastName: Perez Gomez
                    avatarUrl: https://cdn.kapp.konradlorenz.edu.co/avatars/3f8a1c2e.jpg
                    roles: [ROLE_STUDENT]
                    active: true
                  - id: 8e1c4f27-90ab-4d3e-b5f6-1a2b3c4d5e6f
                    email: ana.ruiz@konradlorenz.edu.co
                    firstName: Ana
                    lastName: Ruiz Mejía
                    avatarUrl: null
                    roles: [ROLE_STAFF, ROLE_ADMIN]
                    active: true
                page: 0
                size: 20
                totalElements: 2
                totalPages: 1
                first: true
                last: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/{userId}:
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_ADMIN]
      operationId: getUserById
      summary: Get a user profile by id
      description: |
        Returns one entry of the directory by account id: names, e-mail, roles and activation
        state, with nothing academic.

        **Access: `ROLE_ADMIN` only.** Other roles receive `403` even when the
        id is their own; they read their profile through `GET /api/users/me`.

        Returns `404` when no account carries that id. A well-formed but unknown
        UUID is a `404`, not a `400`.
      tags: [Administration]
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: The requested directory entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryEntry'
              example:
                id: 3f8a1c2e-7b4d-4e5a-9c6f-2d1b8e0a4c73
                email: pepito.perez@konradlorenz.edu.co
                firstName: Pepito
                lastName: Perez Gomez
                avatarUrl: https://cdn.kapp.konradlorenz.edu.co/avatars/3f8a1c2e.jpg
                roles: [ROLE_STUDENT]
                active: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{userId}/status:
    patch:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_ADMIN]
      operationId: setUserStatus
      summary: Activate or deactivate a user
      description: |
        Flips the activation flag of an account. Deactivation is a logical
        delete: the profile is kept for audit, and the account can no longer
        sign in.

        **This writes to two services.** The profile here stops being listed as
        active, and the User API calls
        `PATCH /internal/credentials/{userId}/status` on the Auth API to suspend
        the account — because whether somebody may sign in is decided there,
        not here. The account is changed there first, so a failure part-way leaves
        it locked out rather than listed as inactive while its owner can still
        sign in. If the Auth API cannot be reached, this call fails and nothing
        changes.

        Suspending an account also revokes its refresh tokens, so the app is signed out at its
        next renewal, within the hour an access token lasts.

        **Access: `ROLE_ADMIN` only.** Other roles receive `403`.

        The call is idempotent: setting `active` to the value it already holds
        succeeds and returns the unchanged entry, writing nothing on either
        side. Returns `404` when no account carries that id.
      tags: [Administration]
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusUpdate'
            example:
              active: false
      responses:
        '200':
          description: The directory entry after the status change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryEntry'
              example:
                id: 3f8a1c2e-7b4d-4e5a-9c6f-2d1b8e0a4c73
                email: pepito.perez@konradlorenz.edu.co
                firstName: Pepito
                lastName: Perez Gomez
                avatarUrl: https://cdn.kapp.konradlorenz.edu.co/avatars/3f8a1c2e.jpg
                roles: [ROLE_STUDENT]
                active: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /internal/users:
    post:
      # Not role-protected: reachable only from inside the compose network, with the
      # shared internal token, and it has no gateway route at all.
      x-roles: [SERVICE_ONLY]
      operationId: upsertInternalUser
      summary: Create or update a profile from another service
      description: |
        Service-to-service endpoint. The Auth API calls it at every sign-in with Microsoft, and
        when it creates or changes an account, so the profile carries the names Microsoft gives
        and the roles the Auth API grants.

        **Not reachable from outside.** The API gateway does not route
        `/internal/**`; the path exists only on the user-service port inside the
        Docker network. A request arriving at the gateway for this path gets a
        `404` from the gateway itself and never reaches this service. Do not
        build any client against it — no web, Kotlin or Swift client should ever
        call it.

        **Access: `X-Internal-Token` header only.** No bearer token is involved
        and no user role applies. The token is a shared secret injected as an
        environment variable in both services. A missing or wrong token gives
        `401`.

        **Idempotent upsert keyed by e-mail.** A first call creates the profile;
        a repeated call with the same e-mail updates the existing one and
        returns it. Both return `200`, never `201`, and there is no `409`, so a
        retry after a network timeout is always safe.

        The `id` in the response is the profile identifier the Auth API stores
        and puts in the `sub` claim of every token it signs for this account.
      tags: [Internal]
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalUserUpsert'
            example:
              email: pepito.perez@konradlorenz.edu.co
              firstName: Pepito
              lastName: Perez Gomez
              roles: [ROLE_STUDENT]
      responses:
        '200':
          description: Profile created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryEntry'
              example:
                id: 3f8a1c2e-7b4d-4e5a-9c6f-2d1b8e0a4c73
                email: pepito.perez@konradlorenz.edu.co
                firstName: Pepito
                lastName: Perez Gomez
                avatarUrl: null
                roles: [ROLE_STUDENT]
                active: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /internal/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
        description: The profile's id, the `sub` of the account's tokens.
    delete:
      # Not role-protected: reachable only from inside the compose network, with the
      # shared internal token, and it has no gateway route at all.
      x-roles: [SERVICE_ONLY]
      operationId: deleteInternalUser
      summary: Delete a profile from another service
      description: |
        Service-to-service endpoint. The Auth API calls it when an administrator
        deletes an account, after removing the account's credential. Not reachable
        from outside, with `X-Internal-Token` only, as the upsert above.

        **Idempotent.** `204` whether or not the profile existed, so a deletion
        that timed out can be sent again.
      tags: [Internal]
      security:
        - internalToken: []
      responses:
        '204':
          description: The profile is gone, or was never there
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: |
        Shared secret for service-to-service calls inside the Docker network,
        injected as an environment variable in both the Auth and User services.
        It is not a JWT, it carries no user identity and it is never handed to a
        client application.

  parameters:
    UserIdPath:
      name: userId
      in: path
      required: true
      description: Account identifier, shared with the Auth API as the token `sub` claim.
      schema:
        type: string
        format: uuid
        example: 3f8a1c2e-7b4d-4e5a-9c6f-2d1b8e0a4c73

  schemas:
    ApiError:
      type: object
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          description: >-
            When the service produced this error, in UTC. Not when the request was sent.
          type: string
          format: date-time
        status:
          description: >-
            The HTTP status, repeated in the body so a logged response is self-contained.
          type: integer
          example: 400
        error:
          description: >-
            The status's standard name - `Bad Request`, `Conflict`. For developers, not for users.
          type: string
          example: Bad Request
        message:
          description: >-
            One sentence a person can act on. This is the line worth surfacing in a UI.
          type: string
        path:
          description: >-
            The path that produced the error, so a log line identifies itself.
          type: string
        details:
          description: >-
            Field-by-field reasons, when there are any. `field` names what was wrong and `issue` says what
            about it - this is what a form binds its per-field errors to.
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }

    Role:
      type: string
      description: |
        A role an account holds. `ROLE_STUDENT`, `ROLE_PROFESSOR` and `ROLE_STAFF` are profile
        roles, exactly one per account. The rest are permissions, which add to it.
      enum:
        - ROLE_STUDENT
        - ROLE_PROFESSOR
        - ROLE_STAFF
        - ROLE_ADMIN
        - ROLE_RECEPTION
        - ROLE_MAINTENANCE
        - ROLE_MODERATION
        - ROLE_WELLBEING
      example: ROLE_STUDENT

    AcademicInfo:
      type: object
      description: |
        A student's program, pensum and level, read from SINU for the student themselves. Never
        stored by KApp and never shown to anybody else.
      required: [programCode, programName, pensumCode, currentLevel]
      properties:
        programCode:
          type: string
          maxLength: 20
          description: Academic program code. `506` is Ingeniería de Sistemas.
          example: '506'
        programName:
          type: string
          maxLength: 100
          example: Ingeniería de Sistemas
        pensumCode:
          type: string
          maxLength: 20
          description: |
            Pensum version the student is bound to. Students who enrolled
            under an earlier pensum keep their original pensum, so this is
            not derivable from the program alone.
          example: '1015'
        currentLevel:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
          description: Semester the student is currently in.
          example: 8

    DirectoryEntry:
      type: object
      description: |
        An account as the directory shows it: who it is, what it may do, and whether it is
        active. Nothing academic, nothing private.
      required: [id, email, firstName, lastName, avatarUrl, roles, active]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Account identifier, shared with the Auth API. It is the `sub` claim
            of every token issued for this account.
          example: 3f8a1c2e-7b4d-4e5a-9c6f-2d1b8e0a4c73
        email:
          type: string
          format: email
          maxLength: 100
          description: |
            The institutional address the account signs in with. Read-only here;
            it is owned by the Auth API.
          example: pepito.perez@konradlorenz.edu.co
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          description: As Microsoft gives it at sign-in.
          example: Pepito
        lastName:
          type: string
          minLength: 1
          maxLength: 50
          description: As Microsoft gives it at sign-in.
          example: Perez Gomez
        avatarUrl:
          type: [string, 'null']
          format: uri
          maxLength: 500
          description: Profile picture URL, or null when the user has not uploaded one.
          example: https://cdn.kapp.konradlorenz.edu.co/avatars/3f8a1c2e.jpg
        roles:
          type: array
          minItems: 1
          description: |
            The account's profile role and its permissions, as the Auth API grants them. Read-only
            here.
          items:
            $ref: '#/components/schemas/Role'
          example: [ROLE_STUDENT]
        active:
          type: boolean
          description: |
            False after an administrative deactivation. A deactivated account
            keeps its profile for audit but cannot use the platform.
          example: true

    UserProfile:
      description: |
        A person's own profile: their directory entry, plus the academic block when they are a
        student. Contains no credential data.
      allOf:
        - $ref: '#/components/schemas/DirectoryEntry'
        - type: object
          required: [academic]
          properties:
            academic:
              description: |
                The student's program, pensum and level, read from SINU. `null` for anybody who
                is not a student.
              oneOf:
                - $ref: '#/components/schemas/AcademicInfo'
                - type: 'null'

    UserProfileUpdate:
      type: object
      description: |
        The one thing a person changes about their own profile. `avatarUrl` is required; any
        other field is rejected with `400`.
      required: [avatarUrl]
      additionalProperties: false
      properties:
        avatarUrl:
          type: [string, 'null']
          format: uri
          maxLength: 500
          description: Profile picture URL. Send null to clear it.
          example: https://cdn.kapp.konradlorenz.edu.co/avatars/3f8a1c2e.jpg

    UserStatusUpdate:
      type: object
      description: Activation flag change. Administrative use only.
      required: [active]
      properties:
        active:
          type: boolean
          description: |
            `true` restores platform access, `false` performs a logical delete
            that keeps the profile but revokes access.
          example: false

    InternalUserUpsert:
      type: object
      description: |
        What the Auth API knows about an account: the names Microsoft gives and the roles it
        grants. Matched against an existing profile by `email`, so repeated calls update rather
        than duplicate.
      required: [email, firstName, lastName, roles]
      properties:
        email:
          type: string
          format: email
          maxLength: 100
          description: |
            Natural key of the upsert. Must match the account in the Auth API.
          example: pepito.perez@konradlorenz.edu.co
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          example: Pepito
        lastName:
          type: string
          minLength: 1
          maxLength: 50
          example: Perez Gomez
        roles:
          type: array
          minItems: 1
          description: The account's profile role and its permissions.
          items:
            $ref: '#/components/schemas/Role'
          example: [ROLE_STUDENT]

    PageResponse:
      type: object
      description: |
        One page of the directory. Page indexes are zero-based, so `page: 0` is
        the first page and `first` is true there.
      required: [content, page, size, totalElements, totalPages, first, last]
      properties:
        content:
          type: array
          description: Entries in this page. Empty when the filters match nothing.
          items:
            $ref: '#/components/schemas/DirectoryEntry'
        page:
          type: integer
          format: int32
          minimum: 0
          description: Zero-based index of this page.
          example: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Page size requested. The last page may hold fewer items.
          example: 20
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: Profiles matching the filters across every page.
          example: 2
        totalPages:
          type: integer
          format: int32
          minimum: 0
          description: Number of pages available. Zero when nothing matches.
          example: 1
        first:
          type: boolean
          description: True when `page` is 0.
          example: true
        last:
          type: boolean
          description: True when this is the final page.
          example: true

  examples:
    StudentProfile:
      summary: A student
      value:
        id: 3f8a1c2e-7b4d-4e5a-9c6f-2d1b8e0a4c73
        email: pepito.perez@konradlorenz.edu.co
        firstName: Pepito
        lastName: Perez Gomez
        avatarUrl: https://cdn.kapp.konradlorenz.edu.co/avatars/3f8a1c2e.jpg
        roles: [ROLE_STUDENT]
        active: true
        academic:
          programCode: '506'
          programName: Ingeniería de Sistemas
          pensumCode: '1015'
          currentLevel: 8
    ProfessorProfile:
      summary: A professor
      value:
        id: 6b2d9e40-1c3f-4a57-8e69-0d1f2a3b4c5d
        email: laura.gomez@konradlorenz.edu.co
        firstName: Laura Marcela
        lastName: Gómez Restrepo
        avatarUrl: null
        roles: [ROLE_PROFESSOR]
        active: true
        academic: null
    StaffAdminProfile:
      summary: An administrative employee who also administers KApp
      value:
        id: 8e1c4f27-90ab-4d3e-b5f6-1a2b3c4d5e6f
