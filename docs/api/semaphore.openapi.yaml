openapi: 3.1.0
info:
  title: KApp Semaphore API
  version: 2.0.1
  summary: Academic catalog and student pensum progress (semáforo) for Fundación Universitaria Konrad Lorenz.
  description: |
    The Semaphore service serves the **academic catalog** (programs and pensums) and each
    student's **semáforo**: their pensum with the status of every item. At Konrad Lorenz the
    pensum *is* the semáforo.

    A *semáforo* renders a whole degree plan — the *malla curricular*, also called the *pensum* —
    as a grid: columns are levels (semesters, `1..9`), rows are knowledge areas, and every pensum
    item is coloured by its status. Hence "traffic light".

    ## What comes from SINU, and the one thing a student writes

    SINU is the university's academic record. KApp reads it, for the student signed in, and never
    writes to it. **Everything below is read-only** — the catalog, the student's program, pensum
    and level, the status, period and grade of every course, and the elective bank of each
    semester — **except the student's plans**: their own arrangement of the courses still ahead.
    A change to anything else is made in SINU, through the university, and shows up here on its
    own.

    Until the university opens SINU, a test adapter serves invented data of the same shape, and
    `source` says so on every semáforo. The catalog keeps the 23 published plans as its backup.

    ## Conventions used across this API

    - **Statuses** are SINU's, in five values: `PASSED`, `IN_PROGRESS`, `PENDING` (not taken yet),
      `FAILED` and `POSTPONED` (*aplazada*). `sinuStatus` carries the status exactly as SINU
      writes it, so a client can still show one this list does not know.
    - **Grades** are optional and read-only. When SINU provides one it is an integer on the
      university's `0..50` scale; otherwise it is `null`. No client writes a grade.
    - **Periods** are the university's own academic-period strings: four digits for the year
      followed by `1` or `2` for the semester (`^\d{4}[12]$`). `"20262"` is the second semester of
      2026.
    - **Hours.** A course carries `weeklyHours` (contact hours per week) and, derived from it,
      `totalHours` for the full 16-week semester. The invariant is `weeklyHours * 16 == totalHours`.
      At *pensum* and *area* level, `totalHours` and `hours` are sums of **weekly** hours across
      the plan.

      `weeklyHours` is a **number, not an integer**: it may carry a half. Four items across the
      published plans print one — Psicología's two professional practices at 4,5 hours, and the
      practices of Marketing and Negocios Internacionales at 1,5. A client that reads hours into
      an integer type breaks on exactly those four, and should read a decimal. `totalHours` stays
      an integer everywhere: half an hour a week is eight whole hours a semester.
    - **Every item is addressed by its `pensumItemCode`** — fixed courses and elective slots
      alike, in path parameters, prerequisites and placements. It is KApp's own identifier,
      stable, and **never shown to a person**.
    - **The code a client shows is `sinuCode`**, the course code the university itself uses,
      present only where it is known. Where it is `null`, show the course by its name. KApp
      never invents a code that looks institutional.
    - **Elective slots are slots, not courses.** A pensum carries a number of them (Electiva I..VI
      in Ingeniería de Sistemas). Which course filled a slot already taken comes from SINU
      (`resolvedSinuCode`, `resolvedName`). For a semester still ahead, the student picks one from
      that semester's elective bank, `GET /api/catalog/pensums/{pensumCode}/electives`, in a plan.
    - **`BLOCKED` is not a status SINU has.** The colours a client paints are the five statuses
      and *blocked*, which is derived: a `PENDING` item whose prerequisites are not all `PASSED`.
      `GET /api/semaphore/me/eligible` returns the complement of that set, so a client can paint
      the grid without re-implementing prerequisite resolution.

    ## Authorization

    Every operation requires a JWT bearer token, validated at the API Gateway (`:8080`).

    | Area | Read | Write |
    |---|---|---|
    | `/api/catalog/**` | any authenticated role except `ROLE_GUEST` | — |
    | `POST /api/catalog/pensums/import` | — | `ROLE_ADMIN`, to load the backup |
    | `/api/semaphore/me`, `/summary`, `/eligible` | `ROLE_STUDENT` (the caller's own) | — |
    | `/api/semaphore/me/plans/**` | `ROLE_STUDENT` (the caller's own plans) | `ROLE_STUDENT` |

    `ROLE_PROFESSOR` and `ROLE_STAFF` read the catalog and nothing else here. Neither follows a
    program, so every `/api/semaphore/**` route refuses them — including the plans. No route
    reads another student's semáforo, administrators included.

    A caller who is authenticated but lacks the required role receives `403`, never `404`.

servers:
  - url: http://localhost:8080
    description: Local API gateway

security:
  - bearerAuth: []

tags:
  - name: Catalog
    description: |
      Programs, pensums and each semester's elective bank, as SINU publishes them. Read-only,
      for any authenticated role except `ROLE_GUEST`.
  - name: Student Progress
    description: |
      The student's semáforo, read from SINU: per-course status, derived summary and eligible
      courses.
  - name: Academic Plans
    description: |
      The student's own arrangements of their pensum. The pensum is immutable — the
      *Semáforo Original* — and a plan is a thin layer over it recording only the courses the
      student moved, so the client can draw both the planned position and the original outline.

paths:
  /api/catalog/programs:
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT, ROLE_PROFESSOR, ROLE_STAFF, ROLE_ADMIN]
      operationId: listPrograms
      summary: List academic programs
      description: |
        Returns every academic program in the catalog, each with the code of its currently
        `ACTIVE` pensum. `activePensumCode` is `null` for a program whose only pensums are
        `DRAFT` or `OBSOLETE`.
      tags: [Catalog]
      responses:
        '200':
          description: The program catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Program'
              example:
                - code: "506"
                  name: Ingeniería de Sistemas
                  faculty: Facultad de Matemáticas e Ingenierías
                  level: PREGRADO
                  activePensumCode: "1015"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/catalog/programs/{programCode}:
    parameters:
      - $ref: '#/components/parameters/ProgramCodePath'
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT, ROLE_PROFESSOR, ROLE_STAFF, ROLE_ADMIN]
      operationId: getProgram
      summary: Get one academic program
      description: Returns a single program by its institutional code.
      tags: [Catalog]
      responses:
        '200':
          description: The requested program
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
              example:
                code: "506"
                name: Ingeniería de Sistemas
                faculty: Facultad de Matemáticas e Ingenierías
                level: PREGRADO
                activePensumCode: "1015"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/catalog/pensums:
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT, ROLE_PROFESSOR, ROLE_STAFF, ROLE_ADMIN]
      operationId: listPensums
      summary: List the pensums
      description: |
        Every pensum of the catalog without its items, for listings and pickers: active plans
        first, then by program and code. `GET /api/catalog/pensums/{pensumCode}` has the items.
      tags: [Catalog]
      responses:
        '200':
          description: The pensums, without their items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PensumSummary'
              example:
                - pensumCode: "1015"
                  programCode: "506"
                  programName: Ingeniería de Sistemas
                  faculty: Facultad de Matemáticas e Ingenierías
                  reform: Plan de estudios 2019-1
                  status: ACTIVE
                  totalCredits: 143
                  totalHours: 194
                  levels: 9
                  courses: 51
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/catalog/pensums/{pensumCode}:
    parameters:
      - $ref: '#/components/parameters/PensumCodePath'
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT, ROLE_PROFESSOR, ROLE_STAFF, ROLE_ADMIN]
      operationId: getPensum
      summary: Get a full pensum
      description: |
        Returns the whole pensum document: header, knowledge areas, and **every** pensum item
        (51 for the Ingeniería de Sistemas plan), including its elective slots. This is the single
        call a client needs to render the semáforo grid.

        The example below is a representative slice of the real plan, not the complete list.
      tags: [Catalog]
      responses:
        '200':
          description: The full pensum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pensum'
              examples:
                ingenieriaDeSistemas:
                  $ref: '#/components/examples/Pensum1015'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/catalog/pensums/{pensumCode}/courses:
    parameters:
      - $ref: '#/components/parameters/PensumCodePath'
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT, ROLE_PROFESSOR, ROLE_STAFF, ROLE_ADMIN]
      operationId: listPensumCourses
      summary: List the items of a pensum
      description: |
        Returns the pensum items of one pensum, optionally narrowed by level, knowledge area,
        or elective-slot flag. Filters combine with AND. Omitting every filter returns the same
        list as the `courses` array of `GET /api/catalog/pensums/{pensumCode}`.

        Useful for rendering one column of the grid (`?level=8`) or one row (`?area=ISA`), and for
        listing a pensum's elective slots (`?isElectiveSlot=true`).
      tags: [Catalog]
      parameters:
        - name: level
          in: query
          required: false
          description: Keep only items placed at this level (semester).
          schema:
            type: integer
            minimum: 1
            maximum: 12
          example: 8
        - name: area
          in: query
          required: false
          description: Keep only items of this knowledge area, by area code.
          schema:
            type: string
            maxLength: 20
          example: ISA
        - name: isElectiveSlot
          in: query
          required: false
          description: Keep only elective slots (`true`) or only fixed courses (`false`).
          schema:
            type: boolean
          example: false
      responses:
        '200':
          description: The matching pensum items, ordered by level then name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PensumCourse'
              examples:
                allItems:
                  $ref: '#/components/examples/PensumCourseList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/catalog/pensums/{pensumCode}/electives:
    parameters:
      - $ref: '#/components/parameters/PensumCodePath'
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT, ROLE_PROFESSOR, ROLE_STAFF, ROLE_ADMIN]
      operationId: listPensumElectives
      summary: List a semester's elective bank
      description: |
        The courses SINU offers in one period to fill the elective slots of this pensum. The bank
        changes every semester, which is why it is read for a period and never stored.

        A plan uses it to say which course the student means to take in a slot
        (`electiveSinuCode` on a placement). An offering fills any elective slot of the pensum
        unless `slots` names the ones it fills.

        `404` when the pensum does not exist. A period SINU has not published yet answers an
        empty list, not an error.
      tags: [Catalog]
      parameters:
        - $ref: '#/components/parameters/PeriodQuery'
      responses:
        '200':
          description: The courses offered for the pensum's elective slots in that period
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ElectiveOffering'
              examples:
                bank20262:
                  $ref: '#/components/examples/ElectiveBank'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/catalog/pensums/import:
    post:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_ADMIN]
      operationId: importPensums
      summary: Load the catalog backup from a CSV
      description: |
        Requires `ROLE_ADMIN`. Loads whole pensums from a spreadsheet: the backup of the catalog,
        for when SINU cannot be reached. It is the only write the catalog takes; programs and
        pensums are otherwise SINU's.

        One row per pensum item. The columns before `pensumItemCode` describe the pensum and are
        repeated on every one of its rows; the import checks those repeated values agree with
        each other rather than letting the first row silently win. One file may carry several
        pensums.

        **Nothing is written unless the whole file validates.** A partial import would leave the
        catalog in a state nobody chose, so every problem is collected first and reported
        against the line number of the file.

        **Declared totals are checked, not trusted.** The import adds up the courses and compares
        against `declaredCredits` and `declaredHours` — the latter being the sum of *weekly*
        hours, which is what a pensum's `totalHours` means.

        **Hours may carry a half**, in either `4.5` or the Spanish `4,5` — the latter has to be
        quoted, or it is not one cell but two. Any other fraction is refused against its row.

        Column reference and a template: `docs/templates/`.
      tags: [Catalog]
      parameters:
        - name: dryRun
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Validate the file and report what would happen, without writing anything.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: UTF-8 CSV, at most 5 MB.
      responses:
        '200':
          description: What was imported, or what a dry run would have imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PensumImportReport'
        '400':
          description: |
            The file was rejected and nothing was written. `details` carries one entry per
            problem, labelled with the line of the file or the pensum it belongs to, capped at
            200 entries with the total stated in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: The file is larger than 5 MB.

  /api/semaphore/me:
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT]
      operationId: getMySemaphore
      summary: Get the caller's semáforo
      description: |
        The authenticated student's semáforo, read from SINU: their program, pensum and level,
        and one entry per item of that pensum with its status, period and, when SINU gives it,
        its grade. Nothing here is stored by KApp or writable through it.

        Items SINU has no record of come back `PENDING`, so the list always mirrors the pensum
        one to one.

        `404` when SINU has no program for the caller — someone who is not a student, or not yet
        one.
      tags: [Student Progress]
      responses:
        '200':
          description: The caller's semáforo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentSemaphore'
              examples:
                levelEightStudent:
                  $ref: '#/components/examples/MySemaphore'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/semaphore/me/summary:
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT]
      operationId: getMySemaphoreSummary
      summary: Get the caller's progress summary
      description: |
        Credit totals derived from the caller's semáforo. **Never stored** — recomputed on every
        call, so it cannot drift from the grid the student is looking at.

        Counting rules:

        - `creditsPassed` counts items with status `PASSED`.
        - `creditsInProgress` counts items with status `IN_PROGRESS`.
        - `creditsRemaining` is `totalCredits - creditsPassed - creditsInProgress`; `PENDING`,
          `FAILED` and `POSTPONED` items therefore all count as remaining.
        - `byArea` carries one row per area declared by the pensum, in the pensum's order.
      tags: [Student Progress]
      responses:
        '200':
          description: The derived summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressSummary'
              example:
                creditsPassed: 112
                creditsInProgress: 8
                creditsRemaining: 23
                totalCredits: 143
                percentComplete: 78.3
                byArea:
                  - area: CB
                    creditsPassed: 30
                    creditsTotal: 36
                  - area: BIS
                    creditsPassed: 22
                    creditsTotal: 22
                  - area: ISA
                    creditsPassed: 48
                    creditsTotal: 67
                  - area: SI
                    creditsPassed: 12
                    creditsTotal: 18
                currentLevel: 8
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/semaphore/me/eligible:
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT]
      operationId: listMyEligibleCourses
      summary: List the courses the caller can take next
      description: |
        Returns the pensum items the student may take next: those whose prerequisites are
        **all** `PASSED` and whose own status is still `PENDING`. This is the computation the
        "traffic light" is named for — everything else `PENDING` is *blocked*, and a client can
        paint it as such by subtracting this list from the `PENDING` set.

        Notes:

        - Items with no prerequisites are eligible as soon as they are `PENDING`.
        - `FAILED` and `POSTPONED` items are **not** returned. They are taken again rather than
          for the first time, and their status already says so.
        - Elective slots are returned like any other item.
        - Items are returned in pensum form (`PensumCourse`), not progress form, so the
          client has credits, hours and area available without a second lookup.
        - Taking a course is still done in SINU. This only says what the prerequisites allow.
      tags: [Student Progress]
      responses:
        '200':
          description: The eligible pensum items, ordered by level then name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PensumCourse'
              example:
                - pensumItemCode: "59085"
                  sinuCode: "59085"
                  name: Electiva III
                  level: 7
                  credits: 3
                  weeklyHours: 3
                  totalHours: 48
                  area: ISA
                  isElectiveSlot: true
                  prerequisites: []
                - pensumItemCode: "59088"
                  sinuCode: "59088"
                  name: Electiva IV
                  level: 7
                  credits: 3
                  weeklyHours: 3
                  totalHours: 48
                  area: ISA
                  isElectiveSlot: true
                  prerequisites: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/semaphore/me/plans:
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT]
      operationId: listMyAcademicPlans
      summary: List the student's academic plans
      description: |
        Requires `ROLE_STUDENT`. Returns the caller's own plans, the primary one first.

        A plan is a layer over the pensum, never a copy of it. The pensum stays the
        immutable *Semáforo Original*; a plan records only the courses the student has moved,
        which is why `placements` is usually short and often empty.
      tags: [Academic Plans]
      responses:
        '200':
          description: The caller's plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicPlan'
              examples:
                onePlan:
                  $ref: '#/components/examples/MyPlans'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT]
      operationId: createMyAcademicPlan
      summary: Create an academic plan
      description: |
        Requires `ROLE_STUDENT`. The plan starts empty: every course sits where the pensum puts
        it until the student moves one.

        The first plan a student creates for a pensum becomes their primary automatically.
        A student may hold at most 10 plans per pensum — enough for "what if I take Cálculo in
        the summer", far short of an unbounded collection growing under one account.
      tags: [Academic Plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicPlanRequest'
      responses:
        '201':
          description: The created plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/semaphore/me/plans/{planId}:
    parameters:
      - $ref: '#/components/parameters/PlanIdPath'
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT]
      operationId: getMyAcademicPlan
      summary: Get one academic plan
      description: |
        Requires `ROLE_STUDENT`. `404` for a plan belonging to somebody else, deliberately: a
        `403` would confirm that the identifier exists.
      tags: [Academic Plans]
      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT]
      operationId: updateMyAcademicPlan
      summary: Rename a plan or make it the primary one
      description: |
        Requires `ROLE_STUDENT`. Both fields are optional; sending neither is a `400`.

        Setting `primary` to `true` demotes whichever plan currently holds it for the same
        pensum — there is exactly one primary per student and pensum. Setting it to `false` is
        rejected: a student would be left with none, and something has to be the plan the app
        opens on.
      tags: [Academic Plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicPlanUpdate'
      responses:
        '200':
          description: The updated plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT]
      operationId: deleteMyAcademicPlan
      summary: Delete an academic plan
      description: |
        Requires `ROLE_STUDENT`. Deleting the primary plan promotes the next one by creation
        date; deleting the last plan for a pensum is allowed and simply leaves the student with
        the pensum as published.
      tags: [Academic Plans]
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/semaphore/me/plans/{planId}/placements/{pensumItemCode}:
    parameters:
      - $ref: '#/components/parameters/PlanIdPath'
      - $ref: '#/components/parameters/PensumItemCodePath'
    put:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT]
      operationId: placeCourseInMyPlan
      summary: Move a course to a different level
      description: |
        Requires `ROLE_STUDENT`. Idempotent: moving a course already at that level returns the
        plan unchanged.

        **Moving a course does not make it eligible.** `GET /api/semaphore/me/eligible` is
        computed from prerequisites actually approved, and it ignores plans entirely. Planning
        is not approving, and a plan that could unlock a course by dragging it would be a
        semáforo that lies.

        There is **no cap on how many courses may sit at one level**. Students take more or
        fewer than the nominal six all the time, and a limit here would refuse a real timetable.

        For an elective slot, `electiveSinuCode` names the course from the elective bank the
        student means to take in it. It is a plan, not an enrolment: the bank is checked when the
        plan is read, not when it is saved, because it changes every semester.

        `400` when the item is not in the pensum, when `plannedLevel` is outside 1–12, or when
        `electiveSinuCode` is given for an item that is not an elective slot.
      tags: [Academic Plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlacementRequest'
            examples:
              moveACourse:
                summary: Take a course a semester later
                value:
                  plannedLevel: 9
              chooseAnElective:
                summary: Plan an elective slot with a course from the bank
                value:
                  plannedLevel: 8
                  electiveSinuCode: "59211"
      responses:
        '200':
          description: The plan, including the new placement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT]
      operationId: resetCourseInMyPlan
      summary: Return a course to the level the pensum gives it
      description: |
        Requires `ROLE_STUDENT`. Removes the placement, so the course goes back to its published
        level and an elective slot to no chosen course. `404` when the plan has no placement for
        that item — it was never moved.
      tags: [Academic Plans]
      responses:
        '200':
          description: The plan, without that placement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          description: >-
            When the service produced this error, in UTC. Not when the request was sent.
          type: string
          format: date-time
        status:
          description: >-
            The HTTP status, repeated in the body so a logged response is self-contained.
          type: integer
          example: 400
        error:
          description: >-
            The status's standard name - `Bad Request`, `Conflict`. For developers, not for users.
          type: string
          example: Bad Request
        message:
          description: >-
            One sentence a person can act on. This is the line worth surfacing in a UI.
          type: string
        path:
          description: >-
            The path that produced the error, so a log line identifies itself.
          type: string
        details:
          description: >-
            Field-by-field reasons, when there are any. `field` names what was wrong and `issue` says what
            about it - this is what a form binds its per-field errors to.
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }

    Program:
      type: object
      description: An academic program offered by the university.
      required: [code, name, faculty, level, activePensumCode]
      properties:
        code:
          type: string
          description: Institutional program code.
          maxLength: 20
          example: "506"
        name:
          type: string
          maxLength: 100
          example: Ingeniería de Sistemas
        faculty:
          type: string
          description: Name of the faculty that owns the program.
          maxLength: 100
          example: Facultad de Matemáticas e Ingenierías
        level:
          type: string
          description: Academic level of the program.
          enum:
            - PREGRADO
            - POSGRADO
            - TECNOLOGIA
            - MAESTRIA
            - DOCTORADO
            - CURSOS_DIPLOMADOS
            - ESPECIALIZACION
          example: PREGRADO
        activePensumCode:
          type: [string, "null"]
          description: Code of the program's currently `ACTIVE` pensum, or `null` if it has none.
          maxLength: 20
          example: "1015"

    PensumImportReport:
      type: object
      description: What a bulk import did, or what a dry run would have done.
      required: [dryRun, rowsRead, pensums]
      properties:
        dryRun:
          type: boolean
          description: When true, nothing was written.
        rowsRead:
          type: integer
          description: Data rows in the file, header excluded.
          example: 1203
        pensums:
          description: >-
            One entry per pensum the file described, whether or not it was written - a dry run reports the
            same shape.
          type: array
          items:
            type: object
            required: [pensumCode, programCode, courses]
            properties:
              pensumCode: { type: string, example: "1015" }
              programCode: { type: string, example: "506" }
              programName: { type: string, example: Ingeniería de Sistemas }
              courses: { type: integer, example: 51 }
              declaredCredits:
                type: integer
                description: What the file states.
                example: 143
              computedCredits:
                type: integer
                description: What its courses actually add up to. Equal to `declaredCredits`, or the import would have failed.
                example: 143
              declaredHours: { type: integer, example: 194 }
              computedHours: { type: integer, example: 194 }
              programCreated:
                type: boolean
                description: False when the program already existed and was replaced.
              pensumCreated:
                type: boolean
                description: False when the pensum already existed and was replaced.

    AcademicPlan:
      type: object
      description: |
        A student's own arrangement of a pensum.

        `placements` carries **only the courses that moved**. Anything absent is taken where the
        pensum puts it. That keeps the document small, makes the outline the client draws in
        the original column fall out for free — it knows both levels — and means a change to the
        pensum reaches every plan without rewriting any of them.
      required: [id, name, pensumCode, primary, placements, createdAt, updatedAt]
      properties:
        id:
          type: string
          maxLength: 64
          example: 66f0a1c2e4b0a91d3c5e7f21
        name:
          type: string
          maxLength: 60
          example: Mi plan
        pensumCode:
          description: >-
            The pensum this plan layers over. The plan stores only the moves; everything else is read from
            the pensum.
          type: string
          maxLength: 20
          example: "1015"
        primary:
          type: boolean
          description: The plan the app opens on. Exactly one per student and pensum.
          example: true
        placements:
          type: array
          description: Only the courses the student moved.
          items:
            $ref: '#/components/schemas/Placement'
        createdAt:
          description: >-
            When the student created the plan.
          type: string
          format: date-time
        updatedAt:
          description: >-
            When the plan last changed - a move, a rename, or being made primary.
          type: string
          format: date-time

    Placement:
      type: object
      description: One course pinned to a level other than the pensum's, or an elective slot with a chosen course.
      required: [pensumItemCode, plannedLevel, electiveSinuCode, electiveOffered]
      properties:
        pensumItemCode:
          type: string
          maxLength: 30
          description: The item that moved, by its `pensumItemCode`.
          example: "59098"
        plannedLevel:
          type: integer
          minimum: 1
          maximum: 12
          description: The level the student intends to take it in.
          example: 8
        electiveSinuCode:
          type: [string, "null"]
          maxLength: 20
          description: |
            For an elective slot, the course from the elective bank the student means to take in
            it. `null` for a fixed course, or for a slot with no course chosen.
          example: "59211"
        electiveOffered:
          type: [boolean, "null"]
          description: |
            Whether `electiveSinuCode` is in the elective bank of the current period, checked when
            the plan is read. `false` means the course is not offered this semester and the client
            should say so. `null` when there is no `electiveSinuCode`.
          example: true

    AcademicPlanRequest:
      type: object
      required: [name, pensumCode]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          example: Mi plan
        pensumCode:
          type: string
          maxLength: 20
          description: Must be an existing pensum; `404` otherwise.
          example: "1015"
      additionalProperties: false

    AcademicPlanUpdate:
      type: object
      description: |
        At least one field must be present. An empty object is a `400` rather than a silent
        no-op, so a client bug does not look like a successful save.
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          example: Plan de verano
        primary:
          type: boolean
          description: |
            Only `true` is accepted. Demoting a plan without promoting another would leave the
            student with no primary at all.
          enum: [true]
      additionalProperties: false

    PlacementRequest:
      type: object
      required: [plannedLevel]
      properties:
        plannedLevel:
          description: >-
            The level the student wants to take this course in. Planning only: it does not change what the
            prerequisite rules allow.
          type: integer
          minimum: 1
          maximum: 12
          example: 8
        electiveSinuCode:
          type: [string, "null"]
          maxLength: 20
          description: |
            Only for an elective slot: the `sinuCode` of a course from the elective bank. Omitted
            or `null`, the slot keeps no chosen course.
          example: "59211"
      additionalProperties: false

    PensumArea:
      type: object
      description: |
        A knowledge area — one row of the semáforo grid. Area codes are defined per pensum;
        the Ingeniería de Sistemas plan uses `CB`, `BIS`, `ISA` and `SI`.
      required: [code, name, color, credits, hours]
      properties:
        code:
          type: string
          description: Short area code, unique within the pensum. Twenty characters, because a printed pensum's area column holds words (COMPLEMENTARIA), not slugs.
          maxLength: 20
          example: CB
        name:
          type: string
          maxLength: 100
          example: Ciencias Básicas
        color:
          type: string
          description: Brand colour of the area as an RGB hex triplet, used to tint its row.
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#539392"
        credits:
          type: integer
          description: Total credits the plan assigns to this area.
          minimum: 0
          example: 36
        hours:
          type: number
          description: |
            Total **weekly** hours the plan assigns to this area. A sum of its items, so it
            carries a half wherever one of them does.
          minimum: 0
          multipleOf: 0.5
          example: 44

    PensumCourse:
      type: object
      description: |
        One item of a pensum — a fixed course, or an elective slot with no fixed content.

        **`pensumItemCode` addresses it, `sinuCode` is what you display.** See the conventions
        above.
      required: [pensumItemCode, sinuCode, name, level, credits, weeklyHours, totalHours, area, isElectiveSlot, prerequisites]
      properties:
        pensumItemCode:
          type: string
          description: |
            KApp's stable identifier of this item **within the pensum**, for fixed courses and
            elective slots alike. Path parameters, prerequisites and placements use it. Never
            shown to a person.
          maxLength: 30
          example: "59035"
        sinuCode:
          type: [string, "null"]
          description: |
            The course code as the university's own system (SINU) carries it, or `null` where it
            is not known yet. **The only code a client shows**; where it is `null`, show the
            name.
          maxLength: 20
          example: "59035"
        name:
          type: string
          maxLength: 120
          example: Desarrollo de Aplicaciones Móviles
        level:
          type: integer
          description: The level (semester) this item sits in — the grid column.
          minimum: 1
          maximum: 12
          example: 8
        credits:
          type: integer
          description: Academic credits awarded by the item.
          minimum: 0
          example: 3
        weeklyHours:
          type: number
          description: |
            Contact hours per week: a whole number of hours, or a whole number and a half.

            Only halves; `4.3` is rejected. A whole figure is written whole (`4`, not `4.0`).
          minimum: 0
          multipleOf: 0.5
          example: 4
        totalHours:
          type: integer
          description: 'Contact hours across the full 16-week semester: `weeklyHours * 16`.'
          minimum: 0
          example: 64
        area:
          type: string
          description: Code of the knowledge area this item belongs to — the grid row.
          maxLength: 20
          example: ISA
        isElectiveSlot:
          type: boolean
          description: |
            `true` when this item is a slot filled by a course of the elective bank, rather than a
            fixed course.
          example: false
        prerequisites:
          type: array
          description: |
            The `pensumItemCode`s of the items that must all be `PASSED` before this one can be
            taken. Empty when it has none.
          items:
            type: string
            maxLength: 30
          example: ["48022"]

    Pensum:
      type: object
      description: |
        A pensum — the whole degree plan a semáforo is drawn from.
      required: [pensumCode, programCode, programName, faculty, reform, status, totalCredits, totalHours, levels, areas, courses]
      properties:
        pensumCode:
          type: string
          description: Institutional code of the plan, unique across the catalog.
          maxLength: 20
          example: "1015"
        programCode:
          type: string
          maxLength: 20
          example: "506"
        programName:
          type: string
          maxLength: 100
          example: Ingeniería de Sistemas
        faculty:
          type: string
          maxLength: 100
          example: Facultad de Matemáticas e Ingenierías
        reform:
          type: string
          description: Name of the curricular reform this plan belongs to.
          maxLength: 100
          example: Plan de estudios 2019-1
        status:
          type: string
          description: |
            Lifecycle state of the plan. `ACTIVE` is the one a program's new students follow.
          enum: [ACTIVE, DRAFT, OBSOLETE]
          example: ACTIVE
        totalCredits:
          type: integer
          description: Sum of the credits of every item in the plan.
          minimum: 0
          example: 143
        totalHours:
          type: number
          description: |
            The **weekly** hours the printed plan declares — not semester hours, and not
            recomputed from the items. Where the document prints no total, it is the sum of the
            items and carries a half wherever one of them does.
          minimum: 0
          multipleOf: 0.5
          example: 194
        levels:
          type: integer
          description: Number of levels (semesters) the plan spans — the number of grid columns.
          minimum: 1
          maximum: 12
          example: 9
        areas:
          type: array
          description: The knowledge areas of the plan — the grid rows, in display order.
          items:
            $ref: '#/components/schemas/PensumArea'
        courses:
          type: array
          description: |
            Every item of the plan, fixed courses and elective slots alike. 51 items for the
            Ingeniería de Sistemas plan.
          items:
            $ref: '#/components/schemas/PensumCourse'

    PensumSummary:
      type: object
      description: A pensum without its items, for listings and pickers.
      required: [pensumCode, programCode, programName, faculty, reform, status, totalCredits, totalHours, levels, courses]
      properties:
        pensumCode: { type: string, maxLength: 20, example: "1015" }
        programCode: { type: string, maxLength: 20, example: "506" }
        programName: { type: string, maxLength: 100, example: Ingeniería de Sistemas }
        faculty: { type: string, maxLength: 100, example: Facultad de Matemáticas e Ingenierías }
        reform: { type: string, maxLength: 100, example: Plan de estudios 2019-1 }
        status: { type: string, enum: [ACTIVE, DRAFT, OBSOLETE], example: ACTIVE }
        totalCredits: { type: integer, minimum: 0, example: 143 }
        totalHours:
          type: number
          description: The weekly hours the printed plan declares, as in `Pensum`.
          minimum: 0
          multipleOf: 0.5
          example: 194
        levels: { type: integer, minimum: 1, maximum: 12, example: 9 }
        courses:
          type: integer
          description: How many items the pensum carries, without sending them.
          minimum: 0
          example: 51

    ElectiveOffering:
      type: object
      description: A course SINU offers in one period to fill elective slots.
      required: [sinuCode, name, credits, weeklyHours, slots]
      properties:
        sinuCode:
          type: string
          maxLength: 20
          description: The course code, as SINU carries it. This is what a placement's `electiveSinuCode` names.
          example: "59211"
        name:
          type: string
          maxLength: 120
          example: Computación en la Nube
        credits:
          type: integer
          minimum: 0
          example: 3
        weeklyHours:
          type: number
          minimum: 0
          multipleOf: 0.5
          example: 3
        slots:
          type: array
          description: |
            The `pensumItemCode`s of the slots this course fills. Empty means any elective slot of
            the pensum.
          items:
            type: string
            maxLength: 30
          example: []

    CourseStatus:
      type: string
      description: |
        The status of one item on a student's semáforo, normalised from SINU's.

        - `PASSED` — *aprobada*.
        - `IN_PROGRESS` — being taken this period.
        - `PENDING` — not taken yet.
        - `FAILED` — *perdida*: the last attempt was not passed.
        - `POSTPONED` — *aplazada*. How SINU uses it is to be confirmed with the university;
          until then it counts like a course not passed.

        *Blocked* is **not** a status: it is derived from prerequisites, and is the complement of
        `GET /api/semaphore/me/eligible` within the `PENDING` set.
      enum: [PASSED, IN_PROGRESS, PENDING, FAILED, POSTPONED]
      example: PASSED

    AcademicPeriod:
      type: [string, "null"]
      description: |
        Academic period in the university's own format: four-digit year followed by the semester,
        `1` or `2`. `"20262"` is the second semester of 2026. `null` when the item has not been
        taken yet.
      pattern: '^\d{4}[12]$'
      example: "20262"

    Grade:
      type: [integer, "null"]
      description: |
        Final mark on the university's `0..50` integer scale, as SINU records it. Optional and
        read-only: `null` while the course has not settled, and whenever SINU does not provide
        grades.
      minimum: 0
      maximum: 50
      example: 42

    StudentProgressCourse:
      type: object
      description: |
        One item of a student's semáforo: the status SINU gives a single pensum item, plus the
        course that filled it when the item is an elective slot.
      required: [pensumItemCode, status, sinuStatus, period, grade, resolvedSinuCode, resolvedName]
      properties:
        pensumItemCode:
          type: string
          description: The pensum item this entry is about.
          maxLength: 30
          example: "48022"
        status:
          $ref: '#/components/schemas/CourseStatus'
        sinuStatus:
          type: [string, "null"]
          description: |
            The status exactly as SINU writes it, for a client to show when `status` alone does
            not say enough, or when SINU uses one this API does not know yet. `null` for an item
            SINU has no record of.
          maxLength: 40
          example: APROBADA
        period:
          $ref: '#/components/schemas/AcademicPeriod'
        grade:
          $ref: '#/components/schemas/Grade'
        resolvedSinuCode:
          type: [string, "null"]
          description: |
            For an elective slot, the code of the course that filled it, as SINU records it.
            `null` for a fixed course, and for a slot SINU has not filled.
          maxLength: 20
          example: null
        resolvedName:
          type: [string, "null"]
          description: |
            Name of the course that filled the elective slot, so a client can draw the grid
            without another lookup. `null` whenever `resolvedSinuCode` is.
          maxLength: 120
          example: null

    StudentSemaphore:
      type: object
      description: |
        A student's semáforo as SINU has it: one entry per item of their pensum.
      required: [userId, programCode, pensumCode, currentLevel, source, readAt, courses]
      properties:
        userId:
          type: string
          description: >-
            Identifier of the KApp user, taken from the JWT `sub` claim. An opaque string, never
            parsed as a number.
          example: '507f1f77bcf86cd799439011'
        programCode:
          type: string
          maxLength: 20
          example: "506"
        pensumCode:
          type: string
          description: The pensum SINU has the student on.
          maxLength: 20
          example: "1015"
        currentLevel:
          type: integer
          description: The level (semester) SINU has the student in.
          minimum: 1
          maximum: 12
          example: 8
        source:
          type: string
          enum: [SINU, TEST]
          description: |
            Where this came from. `TEST` is the adapter that serves invented data while the
            university has not opened SINU; a client shows that the data is not real.
          example: SINU
        readAt:
          type: string
          format: date-time
          description: When this was read from SINU. KApp keeps it for a few minutes at most.
          example: "2026-10-05T14:32:11Z"
        courses:
          type: array
          description: |
            One entry per item of the pensum, in the pensum's order. 51 entries for the Ingeniería
            de Sistemas plan; the example in this document shows a representative slice.
          items:
            $ref: '#/components/schemas/StudentProgressCourse'

    ProgressSummary:
      type: object
      description: |
        Credit totals derived from a semáforo. Never stored — recomputed on every request.
      required: [creditsPassed, creditsInProgress, creditsRemaining, totalCredits, percentComplete, byArea, currentLevel]
      properties:
        creditsPassed:
          description: >-
            Credits the student has passed, across every knowledge area.
          type: integer
          minimum: 0
          example: 112
        creditsInProgress:
          description: >-
            Credits the student is enrolled in right now - neither passed nor still to take.
          type: integer
          minimum: 0
          example: 8
        creditsRemaining:
          type: integer
          description: '`totalCredits - creditsPassed - creditsInProgress`.'
          minimum: 0
          example: 23
        totalCredits:
          type: integer
          description: Total credits of the student's pensum.
          minimum: 0
          example: 143
        percentComplete:
          type: number
          format: double
          description: '`creditsPassed / totalCredits * 100`, rounded to one decimal.'
          minimum: 0
          maximum: 100
          example: 78.3
        byArea:
          type: array
          description: One row per area of the pensum, in the pensum's order.
          items:
            $ref: '#/components/schemas/AreaProgress'
        currentLevel:
          description: >-
            The semester SINU has the student in.
          type: integer
          minimum: 1
          maximum: 12
          example: 8

    AreaProgress:
      type: object
      description: Credit progress within one knowledge area.
      required: [area, creditsPassed, creditsTotal]
      properties:
        area:
          type: string
          description: Area code, as declared by the pensum.
          maxLength: 20
          example: ISA
        creditsPassed:
          description: >-
            Credits the student has passed in this knowledge area.
          type: integer
          minimum: 0
          example: 48
        creditsTotal:
          description: >-
            Credits the area holds in total, which is what the progress bar fills against.
          type: integer
          minimum: 0
          example: 67

  parameters:
    ProgramCodePath:
      name: programCode
      in: path
      required: true
      description: Institutional program code.
      schema:
        type: string
        maxLength: 20
      example: "506"
    PensumCodePath:
      name: pensumCode
      in: path
      required: true
      description: Institutional pensum (pensum) code.
      schema:
        type: string
        maxLength: 20
      example: "1015"
    PensumItemCodePath:
      name: pensumItemCode
      in: path
      required: true
      description: The item's `pensumItemCode`, for a fixed course or an elective slot alike.
      schema:
        type: string
        maxLength: 30
      example: "59098"
    PeriodQuery:
      name: period
      in: query
      required: false
      description: The academic period, `^\d{4}[12]$`. The current one when omitted.
      schema:
        type: string
        pattern: '^\d{4}[12]$'
      example: "20262"
    PlanIdPath:
      name: planId
      in: path
      required: true
      description: Identifier of one of the caller's own academic plans.
      schema:
