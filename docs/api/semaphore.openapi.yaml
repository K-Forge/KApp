openapi: 3.1.0
info:
  title: KApp Semaphore API
  version: 1.0.0
  summary: Academic catalog and student pensum progress (semáforo) for Fundación Universitaria Konrad Lorenz.
  description: |
    The Semaphore service owns both the **academic catalog** (programs and pensums) and each
    student's **pensum progress**, because at Konrad Lorenz the pensum *is* the semáforo.

    A *semáforo* renders a whole degree plan — the *malla curricular*, also called the *pensum* —
    as a grid: columns are levels (semesters, `1..9`), rows are knowledge areas, and every pensum
    item is coloured by its status. Hence "traffic light".

    ## Conventions used across this API

    - **Grades** are integers on the university's `0..50` scale (mirrors the `final_grade`
      constraint in the KApp database). There are no decimals. The passing threshold is applied by
      the registrar, not by this service; this service only stores and validates the range.
    - **Periods** are the university's own academic-period strings: four digits for the year
      followed by `1` or `2` for the semester (`^\d{4}[12]$`). `"20262"` is the second semester of
      2026.
    - **Hours.** A course carries `weeklyHours` (contact hours per week) and, derived from it,
      `totalHours` for the full 16-week semester. The invariant is `weeklyHours * 16 == totalHours`.
      At *pensum* and *area* level, `totalHours` and `hours` are sums of **weekly** hours across
      the plan (the Ingeniería de Sistemas plan totals 142 credits and 194 weekly hours).

      `weeklyHours` is a **number, not an integer**: it may carry a half. Four items across the
      published plans print one — Psicología's two professional practices at 4,5 hours, and the
      practices of Marketing and Negocios Internacionales at 1,5 — and rounding them up was what
      made Psicología add up to 175 weekly hours against the 174 its own document prints. No
      other fraction is accepted: a value that is neither a whole hour nor a half is rejected
      with `400`.

      **Whole hours are still written whole.** `4`, never `4.0`, so those four items are the only
      place in the API where hours carry a decimal point — but a client that reads them into an
      integer type breaks on exactly those four, and should read a decimal. `totalHours` stays an
      integer everywhere: half an hour a week is eight whole hours a semester.
    - **Elective slots are slots, not courses.** The Reforma 2018 plan carries six of them
      (Electiva I..VI). A slot has credits and hours but no fixed content: its `code` is `null`,
      `isElectiveSlot` is `true`, and it is addressed by its stable `pensumItemCode`
      (for example `"ELECTIVA_VI"`). A student later *resolves* a slot to a real course.
    - **Identifying a pensum item.** Regular items are addressed by their course `code`.
      Elective slots have no `code`, so wherever this API takes or returns a course identifier —
      path parameters and the `reconciliation` arrays included — a slot is represented by its
      `pensumItemCode`.
    - **`BLOCKED` is not a stored status.** The five colours a client paints are `PASSED`,
      `IN_PROGRESS`, `PENDING`, `FAILED` and *blocked*, but only the first four are persisted.
      "Blocked" is derived: a `PENDING` item whose prerequisites are not all `PASSED`.
      `GET /api/semaphore/me/eligible` returns the complement of that set, so a client can paint
      the grid without re-implementing prerequisite resolution.

    ## Authorization

    Every operation requires a JWT bearer token, validated at the API Gateway (`:8080`).

    | Area | Read | Write |
    |---|---|---|
    | `/api/catalog/**` | any authenticated role except `ROLE_GUEST` | `ROLE_ADMIN` |
    | `/api/semaphore/me/**` | `ROLE_STUDENT` (the caller's own document) | `ROLE_STUDENT` |
    | `/api/semaphore/me/plans/**` | `ROLE_STUDENT` (the caller's own plans) | `ROLE_STUDENT` |
    | `/api/semaphore/{userId}` | `ROLE_ADMIN` | — |

    `ROLE_PROFESSOR` reads the catalogue and nothing else here. A lecturer has no academic
    record of their own, so every `/api/semaphore/**` route refuses them — including the plans.

    A caller who is authenticated but lacks the required role receives `403`, never `404`.

servers:
  - url: http://localhost:8080
    description: Local API gateway

security:
  - bearerAuth: []

tags:
  - name: Catalog
    description: |
      Programs and pensums (pensums). Readable by any authenticated role except `ROLE_GUEST`;
      mutations require `ROLE_ADMIN`.
  - name: Student Progress
    description: |
      The student's semáforo: per-course status, derived summary, eligible courses, and elective
      slot resolution.
  - name: Academic Plans
    description: |
      The student's own arrangements of their pensum. The pensum is immutable — the
      *Semáforo Original* — and a plan is a thin layer over it recording only the courses the
      student moved, so the client can draw both the planned position and the original outline.

paths:
  /api/catalog/programs:
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT, ROLE_PROFESSOR, ROLE_ADMIN]
      operationId: listPrograms
      summary: List academic programs
      description: |
        Returns every academic program in the catalog, each with the code of its currently
        `ACTIVE` pensum. `activePensumCode` is `null` for a program whose only pensums are
        `DRAFT` or `OBSOLETE`.
      tags: [Catalog]
      responses:
        '200':
          description: The program catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Program'
              example:
                - code: "506"
                  name: Ingeniería de Sistemas
                  faculty: Facultad de Matemáticas e Ingenierías
                  level: PREGRADO
                  activePensumCode: "1015"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_ADMIN]
      operationId: createProgram
      summary: Create an academic program
      description: |
        Requires `ROLE_ADMIN`. The institutional code is supplied by the caller rather than
        generated: it already identifies the program in the university's own records.
      tags: [Catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramRequest'
      responses:
        '201':
          description: The created program
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/catalog/programs/{programCode}:
    parameters:
      - $ref: '#/components/parameters/ProgramCodePath'
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT, ROLE_PROFESSOR, ROLE_ADMIN]
      operationId: getProgram
      summary: Get one academic program
      description: Returns a single program by its institutional code.
      tags: [Catalog]
      responses:
        '200':
          description: The requested program
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
              example:
                code: "506"
                name: Ingeniería de Sistemas
                faculty: Facultad de Matemáticas e Ingenierías
                level: PREGRADO
                activePensumCode: "1015"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_ADMIN]
      operationId: replaceProgram
      summary: Replace an academic program
      description: Requires `ROLE_ADMIN`. The code in the path wins; a differing code in the body is a 400.
      tags: [Catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramRequest'
      responses:
        '200':
          description: The updated program
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_ADMIN]
      operationId: deleteProgram
      summary: Delete an academic program
      description: |
        Requires `ROLE_ADMIN`. Refused with `409` while any pensum still references it:
        removing the program would orphan every student following those pensums, and a
        silent cascade is worse than an error a human can read.
      tags: [Catalog]
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/catalog/pensums/{pensumCode}:
    parameters:
      - $ref: '#/components/parameters/PensumCodePath'
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT, ROLE_PROFESSOR, ROLE_ADMIN]
      operationId: getPensum
      summary: Get a full pensum
      description: |
        Returns the whole pensum document: header, knowledge areas, and **every** pensum item
        (roughly 51 for the Ingeniería de Sistemas Reforma 2018 plan), including the six elective
        slots. This is the single call a client needs to render the semáforo grid.

        The example below is a representative slice of the real plan — it spans levels 1 through 9
        and all four areas — and is not the complete 51-item list.
      tags: [Catalog]
      responses:
        '200':
          description: The full pensum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pensum'
              examples:
                ingenieriaDeSistemas2018:
                  $ref: '#/components/examples/Pensum1015'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_ADMIN]
      operationId: replacePensum
      summary: Replace a pensum
      description: |
        Full replacement of an existing pensum. Requires `ROLE_ADMIN`.

        The `pensumCode` in the body must equal the one in the path; a mismatch is rejected with
        `400`.

        Replacing a pensum does **not** rewrite the progress documents that pin it. Students
        whose plan diverged learn about it through the `reconciliation` block on
        `GET /api/semaphore/me`.
      tags: [Catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pensum'
            examples:
              ingenieriaDeSistemas2018:
                $ref: '#/components/examples/Pensum1015'
      responses:
        '200':
          description: The stored pensum after replacement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pensum'
              examples:
                ingenieriaDeSistemas2018:
                  $ref: '#/components/examples/Pensum1015'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_ADMIN]
      operationId: deletePensum
      summary: Delete a pensum
      description: |
        Requires `ROLE_ADMIN`. Refused with `409` while any student still follows it —
        deleting it would leave their progress pointing at a pensum that no longer exists.
      tags: [Catalog]
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/catalog/pensums:
    post:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_ADMIN]
      operationId: createPensum
      summary: Create a pensum
      description: |
        Creates a new pensum. Requires `ROLE_ADMIN`.

        Rejected with `400` when a course declares a prerequisite that is not itself a `code` in
        the same document, when an elective slot carries a non-null `code`, when a non-slot item
        carries a `null` code, when a course `area` is not one of the declared `areas`, or when a
        supplied `totalHours` breaks the `weeklyHours * 16 == totalHours` invariant.

        Rejected with `409` when `pensumCode` already exists — use
        `PUT /api/catalog/pensums/{pensumCode}` to replace it.
      tags: [Catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pensum'
            examples:
              ingenieriaDeSistemas2018:
                $ref: '#/components/examples/Pensum1015'
      responses:
        '201':
          description: Pensum created
          headers:
            Location:
              description: URI of the created pensum
              schema:
                type: string
                example: /api/catalog/pensums/1015
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pensum'
              examples:
                ingenieriaDeSistemas2018:
                  $ref: '#/components/examples/Pensum1015'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/catalog/pensums/import:
    post:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_ADMIN]
      operationId: importPensums
      summary: Import pensums in bulk from a CSV
      description: |
        Requires `ROLE_ADMIN`. Loads whole pensums from a spreadsheet export — 24 programs and
        roughly 1200 rows is data-entry work, not programming, and this is what lets somebody do
        it without touching code.

        One row per pensum item. The columns before `pensumItemCode` describe the pensum and are
        repeated on every one of its rows; the import checks those repeated values agree with
        each other rather than letting the first row silently win. One file may carry several
        pensums.

        **Nothing is written unless the whole file validates.** A partial import would leave the
        catalogue in a state nobody chose, so every problem is collected first and reported
        against the line number of the file.

        **Declared totals are checked, not trusted.** The import adds up the courses and compares
        against `declaredCredits` and `declaredHours` — the latter being the sum of *weekly*
        hours, which is what a pensum's `totalHours` means. The seeded Ingeniería de Sistemas
        plan declares 142 and 194 where its courses give 144 and 197; accepting that silently
        would put the discrepancy in front of a student months later.

        **Hours may carry a half**, in either `4.5` or the Spanish `4,5` — the latter has to be
        quoted, or it is not one cell but two. Any other fraction is refused against its row.

        Column reference and a template: `docs/templates/`.
      tags: [Catalog]
      parameters:
        - name: dryRun
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Validate the file and report what would happen, without writing anything.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: UTF-8 CSV, at most 5 MB.
      responses:
        '200':
          description: What was imported, or what a dry run would have imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PensumImportReport'
        '400':
          description: |
            The file was rejected and nothing was written. `details` carries one entry per
            problem, labelled with the line of the file or the pensum it belongs to, capped at
            200 entries with the total stated in `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: The file is larger than 5 MB.

  /api/catalog/pensums/{pensumCode}/courses:
    parameters:
      - $ref: '#/components/parameters/PensumCodePath'
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT, ROLE_PROFESSOR, ROLE_ADMIN]
      operationId: listPensumCourses
      summary: List the items of a pensum
      description: |
        Returns the pensum items of one pensum, optionally narrowed by level, knowledge area,
        or elective-slot flag. Filters combine with AND. Omitting every filter returns the same
        list as the `courses` array of `GET /api/catalog/pensums/{pensumCode}`.

        Useful for rendering one column of the grid (`?level=8`) or one row (`?area=ISA`), and for
        listing the elective slots a student still has to resolve (`?isElectiveSlot=true`).
      tags: [Catalog]
      parameters:
        - name: level
          in: query
          required: false
          description: Keep only items placed at this level (semester).
          schema:
            type: integer
            minimum: 1
            maximum: 9
          example: 8
        - name: area
          in: query
          required: false
          description: Keep only items of this knowledge area, by area code.
          schema:
            type: string
            maxLength: 20
          example: ISA
        - name: isElectiveSlot
          in: query
          required: false
          description: Keep only elective slots (`true`) or only fixed courses (`false`).
          schema:
            type: boolean
          example: false
      responses:
        '200':
          description: The matching pensum items, ordered by level then name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PensumCourse'
              examples:
                allItems:
                  $ref: '#/components/examples/PensumCourseList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/semaphore/me:
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT]
      operationId: getMySemaphore
      summary: Get the caller's semáforo
      description: |
        Returns the authenticated student's progress document.

        ## Lazily created on first call

        A student never has to be provisioned. If no progress document exists yet, this call
        resolves the `ACTIVE` pensum of the student's `programCode`, pins that `pensumCode` on a
        new document, and materialises one entry per pensum item with status `PENDING`. The
        document therefore always mirrors the pinned pensum one-to-one.

        Because of that, **this endpoint does not return `404` for a student enrolled in a
        program**. `404` is reserved for a caller who has no active program, or whose program has
        no `ACTIVE` pensum to resolve.

        ## Reconciliation

        The document pins the `pensumCode` it was created from. If an administrator later edits
        that pensum, the stored progress can diverge from it, so every response carries a
        `reconciliation` block. Nothing is ever silently dropped or invented:

        - `addedCourses` — pensum items present in the pensum but missing from the stored
          document. They are materialised as `PENDING` and reported here, so the client can tell
          the student their plan grew.
        - `removedCourses` — stored entries whose pensum item no longer exists in the pensum.
          They are **kept** in `courses` (a passed grade is never destroyed) and reported here, so
          the client can show them as no longer counting toward the degree. They are excluded from
          `GET /api/semaphore/me/summary`.
        - `inSync` — `true` exactly when both arrays are empty.

        Identifiers in both arrays are course `code`s, except for elective slots, which have no
        `code` and are reported by `pensumItemCode`.
      tags: [Student Progress]
      responses:
        '200':
          description: The caller's semáforo, with its reconciliation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProgressWithReconciliation'
              examples:
                student506999999:
                  $ref: '#/components/examples/MySemaphore'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/semaphore/me/summary:
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT]
      operationId: getMySemaphoreSummary
      summary: Get the caller's progress summary
      description: |
        Credit totals derived from the caller's semáforo. **Never stored** — recomputed on every
        call from the progress document and the pinned pensum, so it cannot drift from the
        grid the student is looking at.

        Counting rules:

        - `creditsPassed` counts items with status `PASSED`.
        - `creditsInProgress` counts items with status `IN_PROGRESS`.
        - `creditsRemaining` is `totalCredits - creditsPassed - creditsInProgress`; `PENDING` and
          `FAILED` items therefore both count as remaining.
        - Entries reported in `reconciliation.removedCourses` are excluded from every figure, as
          they no longer belong to the plan.
        - `byArea` carries one row per area declared by the pensum, in the pensum's order.
      tags: [Student Progress]
      responses:
        '200':
          description: The derived summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressSummary'
              example:
                creditsPassed: 118
                creditsInProgress: 3
                creditsRemaining: 21
                totalCredits: 142
                percentComplete: 83.1
                byArea:
                  - area: CB
                    creditsPassed: 33
                    creditsTotal: 36
                  - area: BIS
                    creditsPassed: 28
                    creditsTotal: 28
                  - area: ISA
                    creditsPassed: 48
                    creditsTotal: 66
                  - area: SI
                    creditsPassed: 9
                    creditsTotal: 12
                currentLevel: 8
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/semaphore/me/eligible:
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT]
      operationId: listMyEligibleCourses
      summary: List the courses the caller can take next
      description: |
        Returns the pensum items the student may enrol in right now: those whose prerequisites are
        **all** `PASSED` and whose own status is still `PENDING`. This is the computation the
        "traffic light" is named for — everything else `PENDING` is *blocked*, and a client can
        paint it as such by subtracting this list from the `PENDING` set.

        Notes:

        - Items with no prerequisites are eligible as soon as they are `PENDING`.
        - `FAILED` items are **not** returned. They are retakes rather than new enrolments, and are
          already identifiable by their status on the progress document.
        - Unresolved elective slots are returned like any other item; resolve one with
          `POST /api/semaphore/me/electives/{pensumItemCode}`.
        - Items are returned in pensum form (`PensumCourse`), not progress form, so the
          client has credits, hours and area available without a second lookup.
      tags: [Student Progress]
      responses:
        '200':
          description: The eligible pensum items, ordered by level then name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PensumCourse'
              example:
                - code: "56201"
                  pensumItemCode: "1806"
                  name: Metodología de la Investigación
                  level: 8
                  credits: 2
                  weeklyHours: 3
                  totalHours: 48
                  area: SI
                  isElectiveSlot: false
                  prerequisites: []
                - code: null
                  pensumItemCode: ELECTIVA_VI
                  name: Electiva VI
                  level: 9
                  credits: 3
                  weeklyHours: 3
                  totalHours: 48
                  area: ISA
                  isElectiveSlot: true
                  prerequisites: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/semaphore/me/courses/{code}:
    parameters:
      - $ref: '#/components/parameters/CourseCodePath'
    put:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT]
      operationId: updateMyCourseStatus
      summary: Set the status of one course on the caller's semáforo
      description: |
        Sets `status`, `grade` and `period` for a single item of the caller's semáforo and returns
        the updated entry. The whole entry is replaced: omitting `grade` or `period` clears them.

        Validation — all rejected with `400`:

        - `grade` outside the university's `0..50` scale.
        - `status` of `PASSED` or `FAILED` without a `grade`. A settled course must carry the mark
          it settled on.
        - `grade` supplied with a `status` of `PENDING`. A course that has not been taken has no
          mark.
        - `period` that does not match `^\d{4}[12]$`.

        `404` if the identifier does not name an item of the pensum pinned by the caller's
        progress document.
      tags: [Student Progress]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseProgressUpdateRequest'
            examples:
              passedWithGrade:
                summary: Record a passed course
                value:
                  status: PASSED
                  grade: 42
                  period: "20261"
              inProgress:
                summary: Mark a course as currently being taken
                value:
                  status: IN_PROGRESS
                  period: "20262"
              failed:
                summary: Record a failed course
                value:
                  status: FAILED
                  grade: 24
                  period: "20252"
      responses:
        '200':
          description: The updated progress entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProgressCourse'
              example:
                code: "48022"
                pensumItemCode: "1703"
                status: PASSED
                period: "20261"
                grade: 42
                resolvedCode: null
                resolvedName: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/semaphore/me/electives/{pensumItemCode}:
    parameters:
      - $ref: '#/components/parameters/PensumItemCodePath'
    post:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT]
      operationId: resolveMyElectiveSlot
      summary: Resolve an elective slot to a real course
      description: |
        Binds one of the caller's elective slots to the course the student actually took or
        enrolled in. The slot keeps its credits, hours, area and level — only its content is
        decided — so `resolvedCode` and `resolvedName` are recorded on the progress entry while the
        pensum stays untouched.

        Calling this on an already-resolved slot overwrites the previous resolution; use `DELETE`
        to clear it instead.

        `400` if `pensumItemCode` names an item that exists but is not an elective slot, or if
        `resolvedCode` names a course already accounted for elsewhere on the semáforo.
        `404` if the caller's pinned pensum has no such item.

        Resolving a slot does not by itself set its status; follow with
        `PUT /api/semaphore/me/courses/{code}` using the slot's `pensumItemCode`.
      tags: [Student Progress]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElectiveResolutionRequest'
            example:
              resolvedCode: "59035"
              resolvedName: Desarrollo de Aplicaciones Móviles
      responses:
        '200':
          description: The updated progress entry for the slot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProgressCourse'
              example:
                code: null
                pensumItemCode: ELECTIVA_VI
                status: PENDING
                period: null
                grade: null
                resolvedCode: "59035"
                resolvedName: Desarrollo de Aplicaciones Móviles
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT]
      operationId: clearMyElectiveSlot
      summary: Clear an elective slot resolution
      description: |
        Returns the slot to an empty slot: `resolvedCode` and `resolvedName` go back to `null`.
        The slot itself is never removed from the semáforo — it is part of the pensum.

        Idempotent: clearing an already-empty slot also returns `204`.

        `400` if `pensumItemCode` names an item that exists but is not an elective slot.
        `404` if the caller's pinned pensum has no such item.
      tags: [Student Progress]
      responses:
        '204':
          description: Resolution cleared; no body
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/semaphore/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserIdPath'
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_ADMIN]
      operationId: getStudentSemaphore
      summary: Get another student's semáforo
      description: |
        Administrative read of any student's progress document. Requires `ROLE_ADMIN`.

        Unlike `GET /api/semaphore/me`, this call is a plain read: it never creates a document
        lazily, and it carries no `reconciliation` block. `404` therefore means either that no such
        user exists or that the student has never opened their semáforo.
      tags: [Student Progress]
      responses:
        '200':
          description: The student's semáforo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProgress'
              examples:
                student506999999:
                  $ref: '#/components/examples/StudentSemaphore'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/semaphore/me/plans:
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT]
      operationId: listMyAcademicPlans
      summary: List the student's academic plans
      description: |
        Requires `ROLE_STUDENT`. Returns the caller's own plans, the primary one first.

        A plan is a layer over the pensum, never a copy of it. The pensum stays the
        immutable *Semáforo Original*; a plan records only the courses the student has moved,
        which is why `placements` is usually short and often empty.
      tags: [Academic Plans]
      responses:
        '200':
          description: The caller's plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT]
      operationId: createMyAcademicPlan
      summary: Create an academic plan
      description: |
        Requires `ROLE_STUDENT`. The plan starts empty: every course sits where the pensum puts
        it until the student moves one.

        The first plan a student creates for a pensum becomes their primary automatically.
        A student may hold at most 10 plans per pensum — enough for "what if I take Cálculo in
        the summer", far short of an unbounded collection growing under one account.
      tags: [Academic Plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicPlanRequest'
      responses:
        '201':
          description: The created plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/semaphore/me/plans/{planId}:
    parameters:
      - $ref: '#/components/parameters/PlanIdPath'
    get:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT]
      operationId: getMyAcademicPlan
      summary: Get one academic plan
      description: |
        Requires `ROLE_STUDENT`. `404` for a plan belonging to somebody else, deliberately: a
        `403` would confirm that the identifier exists.
      tags: [Academic Plans]
      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT]
      operationId: updateMyAcademicPlan
      summary: Rename a plan or make it the primary one
      description: |
        Requires `ROLE_STUDENT`. Both fields are optional; sending neither is a `400`.

        Setting `primary` to `true` demotes whichever plan currently holds it for the same
        pensum — there is exactly one primary per student and pensum. Setting it to `false` is
        rejected: a student would be left with none, and something has to be the plan the app
        opens on.
      tags: [Academic Plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicPlanUpdate'
      responses:
        '200':
          description: The updated plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT]
      operationId: deleteMyAcademicPlan
      summary: Delete an academic plan
      description: |
        Requires `ROLE_STUDENT`. Deleting the primary plan promotes the next one by creation
        date; deleting the last plan for a pensum is allowed and simply leaves the student with
        the pensum as published.
      tags: [Academic Plans]
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/semaphore/me/plans/{planId}/placements/{code}:
    parameters:
      - $ref: '#/components/parameters/PlanIdPath'
      - $ref: '#/components/parameters/CourseCodePath'
    put:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT]
      operationId: placeCourseInMyPlan
      summary: Move a course to a different level
      description: |
        Requires `ROLE_STUDENT`. Idempotent: moving a course already at that level returns the
        plan unchanged.

        **Moving a course does not make it eligible.** `GET /api/semaphore/me/eligible` is
        computed from prerequisites actually approved, and it ignores plans entirely. Planning
        is not approving, and a plan that could unlock a course by dragging it would be a
        semáforo that lies.

        There is **no cap on how many courses may sit at one level**. Students take more or
        fewer than the nominal six all the time, and a limit here would refuse a real timetable.

        `400` when the course is not in the pensum, or when `plannedLevel` is outside 1–12.
      tags: [Academic Plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlacementRequest'
      responses:
        '200':
          description: The plan, including the new placement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      # Authorization as the code enforces it, not as prose describes it.
      x-roles: [ROLE_STUDENT]
      operationId: resetCourseInMyPlan
      summary: Return a course to the level the pensum gives it
      description: |
        Requires `ROLE_STUDENT`. Removes the placement, so the course goes back to its published
        level. `404` when the plan has no placement for that course — it was never moved.
      tags: [Academic Plans]
      responses:
        '200':
          description: The plan, without that placement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required: [timestamp, status, error, message, path]
      properties:
        timestamp:
          description: >-
            When the service produced this error, in UTC. Not when the request was sent.
          type: string
          format: date-time
        status:
          description: >-
            The HTTP status, repeated in the body so a logged response is self-contained.
          type: integer
          example: 400
        error:
          description: >-
            The status's standard name - `Bad Request`, `Conflict`. For developers, not for users.
          type: string
          example: Bad Request
        message:
          description: >-
            One sentence a person can act on. This is the line worth surfacing in a UI.
          type: string
        path:
          description: >-
            The path that produced the error, so a log line identifies itself.
          type: string
        details:
          description: >-
            Field-by-field reasons, when there are any. `field` names what was wrong and `issue` says what
            about it - this is what a form binds its per-field errors to.
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }

    Program:
      type: object
      description: An academic program offered by the university.
      required: [code, name, faculty, level, activePensumCode]
      properties:
        code:
          type: string
          description: Institutional program code.
          maxLength: 20
          example: "506"
        name:
          type: string
          maxLength: 100
          example: Ingeniería de Sistemas
        faculty:
          type: string
          description: Name of the faculty that owns the program.
          maxLength: 100
          example: Facultad de Matemáticas e Ingenierías
        level:
          type: string
          description: Academic level of the program, matching the KApp `program_level_enum`.
          enum:
            - PREGRADO
            - POSGRADO
            - TECNOLOGIA
            - MAESTRIA
            - DOCTORADO
            - CURSOS_DIPLOMADOS
            - ESPECIALIZACION
          example: PREGRADO
        activePensumCode:
          type: [string, "null"]
          description: |
            Code of the program's currently `ACTIVE` pensum, or `null` if it has none.
            This is the pensum that `GET /api/semaphore/me` pins for new students.
          maxLength: 20
          example: "1015"

    PensumImportReport:
      type: object
      description: What a bulk import did, or what a dry run would have done.
      required: [dryRun, rowsRead, pensums]
      properties:
        dryRun:
          type: boolean
          description: When true, nothing was written.
        rowsRead:
          type: integer
          description: Data rows in the file, header excluded.
          example: 1203
        pensums:
          description: >-
            One entry per pensum the file described, whether or not it was written - a dry run reports the
            same shape.
          type: array
          items:
            type: object
            required: [pensumCode, programCode, courses]
            properties:
              pensumCode: { type: string, example: "1015" }
              programCode: { type: string, example: "506" }
              programName: { type: string, example: Ingeniería de Sistemas }
              courses: { type: integer, example: 48 }
              declaredCredits:
                type: integer
                description: What the file states.
                example: 142
              computedCredits:
                type: integer
                description: What its courses actually add up to. Equal to `declaredCredits`, or the import would have failed.
                example: 142
              declaredHours: { type: integer, example: 194 }
              computedHours: { type: integer, example: 194 }
              programCreated:
                type: boolean
                description: False when the program already existed and was replaced.
              pensumCreated:
                type: boolean
                description: False when the pensum already existed and was replaced.

    AcademicPlan:
      type: object
      description: |
        A student's own arrangement of a pensum.

        `placements` carries **only the courses that moved**. Anything absent is taken where the
        pensum puts it. That keeps the document small, makes the outline the client draws in
        the original column fall out for free — it knows both levels — and means a change to the
        pensum reaches every plan without rewriting any of them.
      required: [id, name, pensumCode, primary, placements, createdAt, updatedAt]
      properties:
        id:
          type: string
          maxLength: 64
          example: 66f0a1c2e4b0a91d3c5e7f21
        name:
          type: string
          maxLength: 60
          example: Mi plan
        pensumCode:
          description: >-
            The pensum this plan layers over. The plan stores only the moves; everything else is read from
            the pensum.
          type: string
          maxLength: 20
          example: "1015"
        primary:
          type: boolean
          description: The plan the app opens on. Exactly one per student and pensum.
          example: true
        placements:
          type: array
          description: Only the courses the student moved.
          items:
            $ref: '#/components/schemas/Placement'
        createdAt:
          description: >-
            When the student created the plan.
          type: string
          format: date-time
        updatedAt:
          description: >-
            When the plan last changed - a move, a rename, or being made primary.
          type: string
          format: date-time

    Placement:
      type: object
      description: One course pinned to a level other than the pensum's.
      required: [code, plannedLevel]
      properties:
        code:
          type: string
          maxLength: 30
          description: |
            The course `code`, or an elective slot's `pensumItemCode` — the same identifier
            `PUT /api/semaphore/me/courses/{code}` accepts.
          example: "17085"
        plannedLevel:
          type: integer
          minimum: 1
          maximum: 12
          description: The level the student intends to take it in.
          example: 7

    AcademicPlanRequest:
      type: object
      required: [name, pensumCode]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          example: Mi plan
        pensumCode:
          type: string
          maxLength: 20
          description: Must be an existing pensum; `404` otherwise.
          example: "1015"
      additionalProperties: false

    AcademicPlanUpdate:
      type: object
      description: |
        At least one field must be present. An empty object is a `400` rather than a silent
        no-op, so a client bug does not look like a successful save.
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          example: Plan de verano
        primary:
          type: boolean
          description: |
            Only `true` is accepted. Demoting a plan without promoting another would leave the
            student with no primary at all.
          enum: [true]
      additionalProperties: false

    PlacementRequest:
      type: object
      required: [plannedLevel]
      properties:
        plannedLevel:
          description: >-
            The level the student wants to take this course in. Planning only: it does not change what the
            prerequisite rules allow.
          type: integer
          minimum: 1
          maximum: 12
          example: 7
      additionalProperties: false

    ProgramRequest:
      type: object
      description: >-
        The writable half of a program. `activePensumCode` is absent on purpose: it is
        derived from whichever pensum is currently `ACTIVE`, so letting a caller set it
        would allow the two to disagree.
      required: [code, name, faculty, level]
      properties:
        code:
          type: string
          description: Institutional program code. Immutable once created.
          maxLength: 20
          example: "506"
        name:
          type: string
          maxLength: 100
          example: Ingeniería de Sistemas
        faculty:
          type: string
          maxLength: 100
          example: Facultad de Matemáticas e Ingenierías
        level:
          type: string
          enum: [PREGRADO, POSGRADO, TECNOLOGIA, MAESTRIA, DOCTORADO,
                 CURSOS_DIPLOMADOS, ESPECIALIZACION]
          example: PREGRADO
      additionalProperties: false

    PensumArea:
      type: object
      description: |
        A knowledge area — one row of the semáforo grid. Area codes are defined per pensum;
        the Ingeniería de Sistemas Reforma 2018 plan uses `CB`, `BIS`, `ISA` and `SI`.
      required: [code, name, color, credits, hours]
      properties:
        code:
          type: string
          description: Short area code, unique within the pensum. Twenty characters, because a printed pensum's area column holds words (COMPLEMENTARIA), not slugs.
          maxLength: 20
          example: CB
        name:
          type: string
          maxLength: 100
          example: Ciencias Básicas
        color:
          type: string
          description: Brand colour of the area as an RGB hex triplet, used to tint its row.
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: "#539392"
        credits:
          type: integer
          description: Total credits the plan assigns to this area.
          minimum: 0
          example: 36
        hours:
          type: number
          description: |
            Total **weekly** hours the plan assigns to this area. A sum of its items, so it
            carries a half wherever one of them does.
          minimum: 0
          multipleOf: 0.5
          example: 44

    PensumCourse:
      type: object
      description: |
        One item of a pensum — a fixed course, or an elective slot with no fixed content.

        For an elective slot, `code` is `null` and `isElectiveSlot` is `true`; the slot is
        addressed by `pensumItemCode`. For a fixed course, `code` is always present.
      required: [code, pensumItemCode, name, level, credits, weeklyHours, area, isElectiveSlot, prerequisites]
      properties:
        code:
          type: [string, "null"]
          description: |
            Institutional course code. `null` for an elective slot, which has no fixed content.
          maxLength: 20
          example: "59035"
        pensumItemCode:
          type: string
          description: |
            Stable identifier of this item **within the pensum**. Unlike `code`, it is never
            `null`, so it is what elective slots are addressed by (for example `"ELECTIVA_VI"`).
          maxLength: 30
          example: "2033"
        name:
          type: string
          maxLength: 120
          example: Desarrollo de Aplicaciones Móviles
        level:
          type: integer
          description: The level (semester) this item sits in — the grid column.
          minimum: 1
          maximum: 12
          example: 8
        credits:
          type: integer
          description: Academic credits awarded by the item.
          minimum: 0
          example: 3
        weeklyHours:
          type: number
          description: |
            Contact hours per week: a whole number of hours, or a whole number and a half.

            Only halves; `4.3` is rejected. A whole figure is written whole (`4`, not `4.0`).
          minimum: 0
          multipleOf: 0.5
          example: 4
        totalHours:
          type: integer
          description: |
            Contact hours across the full 16-week semester. Derived: `weeklyHours * 16`.

            Omit it on write and the server derives it; supply it and it must satisfy the
            invariant or the request is rejected with `400`. It is always present on read, which
            is why it is not in `required`.
          minimum: 0
          example: 64
        area:
          type: string
          description: Code of the knowledge area this item belongs to — the grid row.
          maxLength: 20
          example: ISA
        isElectiveSlot:
          type: boolean
          description: |
            `true` when this item is a slot the student later resolves to a real course, rather
            than a fixed course.
          example: false
        prerequisites:
          type: array
          description: |
            Codes of the courses that must all be `PASSED` before this item can be taken. Empty
            when the item has none. Every entry must be the `code` of another item of the same
            pensum.
          items:
            type: string
            maxLength: 20
          example: ["48022"]

    Pensum:
      type: object
      description: |
        A pensum — the whole degree plan a semáforo is drawn from.
      required: [pensumCode, programCode, programName, faculty, reform, status, totalCredits, totalHours, levels, areas, courses]
      properties:
        pensumCode:
          type: string
          description: Institutional code of the plan, unique across the catalog.
          maxLength: 20
          example: "1015"
        programCode:
          type: string
          maxLength: 20
          example: "506"
        programName:
          type: string
          maxLength: 100
          example: Ingeniería de Sistemas
        faculty:
          type: string
          maxLength: 100
          example: Facultad de Matemáticas e Ingenierías
        reform:
          type: string
          description: Name of the curricular reform this plan belongs to.
          maxLength: 100
          example: Reforma del Plan de Estudios 2018
        status:
          type: string
          description: |
            Lifecycle state of the plan. Only an `ACTIVE` plan is pinned to new students by
            `GET /api/semaphore/me`.
          enum: [ACTIVE, DRAFT, OBSOLETE]
          example: ACTIVE
        totalCredits:
          type: integer
          description: Sum of the credits of every item in the plan.
          minimum: 0
          example: 142
        totalHours:
          type: number
          description: |
            The **weekly** hours the printed plan declares — not semester hours, and not
            recomputed from the items. Where the document prints no total, it is the sum of the
            items and carries a half wherever one of them does.
          minimum: 0
          multipleOf: 0.5
          example: 194
        levels:
          type: integer
          description: Number of levels (semesters) the plan spans — the number of grid columns.
          minimum: 1
          maximum: 12
          example: 9
        areas:
          type: array
          description: The knowledge areas of the plan — the grid rows, in display order.
          items:
            $ref: '#/components/schemas/PensumArea'
        courses:
          type: array
          description: |
            Every item of the plan, fixed courses and elective slots alike. Roughly 51 items for
            the Ingeniería de Sistemas Reforma 2018 plan.
          items:
            $ref: '#/components/schemas/PensumCourse'

    CourseStatus:
      type: string
      description: |
        Stored status of one item on a student's semáforo.

        Note that *blocked* is **not** a stored status: it is derived from prerequisites, and is
        the complement of `GET /api/semaphore/me/eligible` within the `PENDING` set.
      enum: [PASSED, IN_PROGRESS, PENDING, FAILED]
      example: PASSED

    AcademicPeriod:
      type: [string, "null"]
      description: |
        Academic period in the university's own format: four-digit year followed by the semester,
        `1` or `2`. `"20262"` is the second semester of 2026. `null` when the item has not been
        scheduled yet.
      pattern: '^\d{4}[12]$'
      example: "20262"

    Grade:
      type: [integer, "null"]
      description: |
        Final mark on the university's `0..50` integer scale. `null` while the course has not
        settled.
      minimum: 0
      maximum: 50
      example: 42

    StudentProgressCourse:
      type: object
      description: |
        One item of a student's semáforo: the status of a single pensum item, plus the elective
        resolution when the item is a slot.
      required: [code, pensumItemCode, status, period, grade, resolvedCode, resolvedName]
      properties:
        code:
          type: [string, "null"]
          description: |
            Course code of the pensum item. `null` for an elective slot — even a resolved one,
            whose real course is carried by `resolvedCode`.
          maxLength: 20
          example: "48022"
        pensumItemCode:
          type: string
          description: Identifier of the pensum item this entry tracks.
          maxLength: 30
          example: "1703"
        status:
          $ref: '#/components/schemas/CourseStatus'
        period:
          $ref: '#/components/schemas/AcademicPeriod'
        grade:
          $ref: '#/components/schemas/Grade'
        resolvedCode:
          type: [string, "null"]
          description: |
            Code of the real course this elective slot was resolved to. Always `null` for a fixed
            course, and `null` for an unresolved slot.
          maxLength: 20
          example: null
        resolvedName:
          type: [string, "null"]
          description: |
            Name of the real course this elective slot was resolved to, denormalised so a client
            can render the grid without a catalog lookup. Always `null` for a fixed course.
          maxLength: 120
          example: null

    Reconciliation:
      type: object
      description: |
        How the stored progress document compares with the pensum it pins, after an
        administrator edited that pensum. Nothing is dropped or invented silently: every
        divergence is reported here.

        Identifiers are course `code`s, except for elective slots, which have no `code` and are
        reported by `pensumItemCode`.
      required: [addedCourses, removedCourses, inSync]
      properties:
        addedCourses:
          type: array
          description: |
            Items the pensum now has and the document did not. They have been materialised as
            `PENDING`.
          items:
            type: string
            maxLength: 30
          example: ["56201"]
        removedCourses:
          type: array
          description: |
            Entries the document holds whose pensum item no longer exists in the pensum. They
            are kept in `courses` so no grade is lost, and are excluded from the summary.
          items:
            type: string
            maxLength: 30
          example: []
        inSync:
          type: boolean
          description: '`true` exactly when both arrays are empty.'
          example: false

    StudentProgress:
      type: object
      description: |
        A student's semáforo: one entry per item of the pinned pensum.
      required: [userId, studentCode, programCode, pensumCode, currentLevel, courses, updatedAt]
      properties:
        userId:
          type: string
          description: >-
            Identifier of the KApp user, taken from the JWT `sub` claim. An opaque
            string, not a number: it is a MongoDB ObjectId and must never be parsed
            as an integer.
          example: '507f1f77bcf86cd799439011'
        studentCode:
          type: string
          description: Institutional student code.
          maxLength: 20
          example: "506999999"
        programCode:
          type: string
          maxLength: 20
          example: "506"
        pensumCode:
          type: string
          description: |
            The pensum this document is pinned to. It does not follow later edits of that
            pensum on its own — see the `reconciliation` block of `GET /api/semaphore/me`.
          maxLength: 20
          example: "1015"
        currentLevel:
          type: integer
          description: The level (semester) the student is currently in.
          minimum: 1
          maximum: 12
          example: 8
        courses:
          type: array
          description: |
            One entry per item of the pinned pensum, plus any entry retained from a removed item.
            Roughly 51 entries for the Ingeniería de Sistemas Reforma 2018 plan; the examples in
            this document show a representative slice.
          items:
            $ref: '#/components/schemas/StudentProgressCourse'
        updatedAt:
          type: string
          format: date-time
          description: When the document was last written.
          example: "2026-08-20T14:32:11Z"

    StudentProgressWithReconciliation:
      allOf:
        - $ref: '#/components/schemas/StudentProgress'
        - type: object
          required: [reconciliation]
          properties:
            reconciliation:
              $ref: '#/components/schemas/Reconciliation'
      description: |
        A student's semáforo together with its reconciliation status. Returned by
        `GET /api/semaphore/me`, which is the only caller that can reconcile the document against
        its pensum on read.

    ProgressSummary:
      type: object
      description: |
        Credit totals derived from a semáforo. Never stored — recomputed on every request.
      required: [creditsPassed, creditsInProgress, creditsRemaining, totalCredits, percentComplete, byArea, currentLevel]
      properties:
        creditsPassed:
          description: >-
            Credits the student has passed, across every knowledge area.
          type: integer
          minimum: 0
          example: 118
        creditsInProgress:
          description: >-
            Credits the student is enrolled in right now - neither passed nor still to take.
          type: integer
          minimum: 0
          example: 3
        creditsRemaining:
          type: integer
          description: '`totalCredits - creditsPassed - creditsInProgress`.'
          minimum: 0
          example: 21
        totalCredits:
          type: integer
          description: Total credits of the pinned pensum.
          minimum: 0
          example: 142
        percentComplete:
          type: number
          format: double
          description: '`creditsPassed / totalCredits * 100`, rounded to one decimal.'
          minimum: 0
          maximum: 100
          example: 83.1
        byArea:
          type: array
          description: One row per area of the pensum, in the pensum's order.
          items:
            $ref: '#/components/schemas/AreaProgress'
        currentLevel:
          description: >-
            The semester the student is counted as being in. Derived from what they have passed, not from
            what they planned.
          type: integer
          minimum: 1
          maximum: 12
          example: 8

    AreaProgress:
      type: object
      description: Credit progress within one knowledge area.
      required: [area, creditsPassed, creditsTotal]
      properties:
        area:
          type: string
          description: Area code, as declared by the pensum.
          maxLength: 10
          example: ISA
        creditsPassed:
          description: >-
            Credits the student has passed in this knowledge area.
          type: integer
          minimum: 0
          example: 48
        creditsTotal:
          description: >-
            Credits the area holds in total, which is what the progress bar fills against.
          type: integer
          minimum: 0
          example: 66

    CourseProgressUpdateRequest:
      type: object
      description: |
        New state for one item of the caller's semáforo. The entry is replaced wholesale: omitting
        `grade` or `period` clears the stored value.
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/CourseStatus'
        grade:
          type: [integer, "null"]
          description: |
            Final mark on the `0..50` scale. **Required** when `status` is `PASSED` or `FAILED`,
            and rejected when `status` is `PENDING`.
          minimum: 0
          maximum: 50
          example: 42
        period:
          type: [string, "null"]
          description: |
            Academic period the course was taken in, `^\d{4}[12]$`. Clear it by omitting it or
            sending `null`.
          pattern: '^\d{4}[12]$'
          example: "20261"

    ElectiveResolutionRequest:
      type: object
      description: The real course an elective slot is being resolved to.
      required: [resolvedCode, resolvedName]
      properties:
        resolvedCode:
          type: string
          description: |
            Institutional code of the real course taken for this slot. It does not have to belong
            to the student's own pensum — electives are frequently taken from other programs.
          maxLength: 20
          example: "59035"
        resolvedName:
          type: string
          description: Name of the real course, stored denormalised for display.
          maxLength: 120
          example: Desarrollo de Aplicaciones Móviles

  parameters:
    ProgramCodePath:
      name: programCode
      in: path
      required: true
      description: Institutional program code.
      schema:
        type: string
        maxLength: 20
      example: "506"
    PensumCodePath:
      name: pensumCode
      in: path
      required: true
      description: Institutional pensum (pensum) code.
      schema:
        type: string
        maxLength: 20
      example: "1015"
    CourseCodePath:
      name: code
      in: path
      required: true
      description: |
        Identifier of the pensum item. The course `code` for a fixed course, or — because an
        elective slot has no `code` — the slot's `pensumItemCode`.
      schema:
        type: string
        maxLength: 30
      example: "48022"
    PensumItemCodePath:
      name: pensumItemCode
      in: path
      required: true
      description: Stable identifier of the elective slot within the pensum.
      schema:
        type: string
        maxLength: 30
      example: ELECTIVA_VI
    UserIdPath:
      name: userId
      in: path
      required: true
      description: |
        Identifier of the KApp user whose semáforo is being read. This is the `sub` claim of
        the access token — a UUID string, never a number. A client generated from an earlier
        revision of this file typed it as `int64`, which no real identifier has ever matched.
      schema:
        type: string
        maxLength: 64
      example: cb37abf3-7a85-49f4-8bd4-e00726630f53
    PlanIdPath:
      name: planId
      in: path
      required: true
      description: Identifier of one of the caller's own academic plans.
      schema:
        type: string
        maxLength: 64
      example: 66f0a1c2e4b0a91d3c5e7f21

