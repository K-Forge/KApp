# Profiles and directory search.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels: {app.kubernetes.io/name: user-service}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: user-service}
  template:
    metadata:
      labels: {app.kubernetes.io/name: user-service}
    spec:
      containers:
        - name: user-service
          image: kapp/user-service:kind
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8082}
          envFrom:
            - configMapRef: {name: kapp-config}
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: MONGODB_URI
              valueFrom: {secretKeyRef: {name: kapp-secrets, key: MONGO_USER_URI}}
            - name: KAPP_INTERNAL_TOKEN
              valueFrom: {secretKeyRef: {name: kapp-secrets, key: KAPP_INTERNAL_TOKEN}}
          # The same 512 MB Compose gives each JVM; the images size their heap from the limit.
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 512Mi}
          # A JVM takes up to a minute to start on a laptop. The startup probe gives it three
          # before Kubernetes restarts it; after that, liveness restarts a hung one and readiness
          # keeps traffic away until it can serve.
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  labels: {app.kubernetes.io/name: user-service}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: user-service}
  ports:
    - name: http
      port: 8082
      targetPort: http
