# The local cluster: one node, which is enough to run everything and to show what Kubernetes adds.
# The gateway and the portal are published where Compose publishes them, so the apps, the portal
# and the scripts keep their URLs. Only on 127.0.0.1: nothing on the local network reaches it
# unless listenAddress is changed on purpose.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kapp
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
      - containerPort: 30300
        hostPort: 4300
        listenAddress: "127.0.0.1"
