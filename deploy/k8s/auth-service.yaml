# Credentials, RS256 tokens and their JWKS, invitation codes, visitor passes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels: {app.kubernetes.io/name: auth-service}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: auth-service}
  template:
    metadata:
      labels: {app.kubernetes.io/name: auth-service}
    spec:
      containers:
        - name: auth-service
          image: kapp/auth-service:kind
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8081}
          envFrom:
            - configMapRef: {name: kapp-config}
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: MONGODB_URI
              valueFrom: {secretKeyRef: {name: kapp-secrets, key: MONGO_AUTH_URI}}
            - name: KAPP_INTERNAL_TOKEN
              valueFrom: {secretKeyRef: {name: kapp-secrets, key: KAPP_INTERNAL_TOKEN}}
            # Optional: without them auth-service generates a key pair at start. That is why it
            # runs as one replica - two would sign with two different keys.
            - name: KAPP_JWT_PRIVATE_KEY
              valueFrom: {secretKeyRef: {name: kapp-secrets, key: KAPP_JWT_PRIVATE_KEY, optional: true}}
            - name: KAPP_JWT_PUBLIC_KEY
              valueFrom: {secretKeyRef: {name: kapp-secrets, key: KAPP_JWT_PUBLIC_KEY, optional: true}}
            - name: SPRING_MAIL_HOST
              valueFrom: {secretKeyRef: {name: kapp-secrets, key: SPRING_MAIL_HOST, optional: true}}
            - name: SPRING_MAIL_USERNAME
              valueFrom: {secretKeyRef: {name: kapp-secrets, key: SPRING_MAIL_USERNAME, optional: true}}
            - name: SPRING_MAIL_PASSWORD
              valueFrom: {secretKeyRef: {name: kapp-secrets, key: SPRING_MAIL_PASSWORD, optional: true}}
          # The same 512 MB Compose gives each JVM; the images size their heap from the limit.
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 512Mi}
          # A JVM takes up to a minute to start on a laptop. The startup probe gives it three
          # before Kubernetes restarts it; after that, liveness restarts a hung one and readiness
          # keeps traffic away until it can serve.
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels: {app.kubernetes.io/name: auth-service}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: auth-service}
  ports:
    - name: http
      port: 8081
      targetPort: http
