# Eureka. The services register here and the gateway resolves them from here, as under Compose.
# Kubernetes Services could replace it; keeping it means the code runs unchanged on both.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  labels: {app.kubernetes.io/name: discovery-server}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: discovery-server}
  template:
    metadata:
      labels: {app.kubernetes.io/name: discovery-server}
    spec:
      containers:
        - name: discovery-server
          image: kapp/discovery-server:kind
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8761}
          envFrom:
            - configMapRef: {name: kapp-config}
          env:
            - name: SERVER_PORT
              value: "8761"
          # The same 512 MB Compose gives each JVM; the images size their heap from the limit.
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 512Mi}
          # A JVM takes up to a minute to start on a laptop. The startup probe gives it three
          # before Kubernetes restarts it; after that, liveness restarts a hung one and readiness
          # keeps traffic away until it can serve.
          startupProbe:
            httpGet: {path: /actuator/health, port: http}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /actuator/health, port: http}
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health, port: http}
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  labels: {app.kubernetes.io/name: discovery-server}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: discovery-server}
  ports:
    - name: http
      port: 8761
      targetPort: http
