# The only way in, as under Compose. A NodePort that kind-config.yaml maps to localhost:8080,
# so every client keeps the URL it already uses.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels: {app.kubernetes.io/name: api-gateway}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: api-gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api-gateway}
    spec:
      containers:
        - name: api-gateway
          image: kapp/api-gateway:kind
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: kapp-config}
          env:
            - name: SERVER_PORT
              value: "8080"
          # The same 512 MB Compose gives each JVM; the images size their heap from the limit.
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 512Mi}
          # A JVM takes up to a minute to start on a laptop. The startup probe gives it three
          # before Kubernetes restarts it; after that, liveness restarts a hung one and readiness
          # keeps traffic away until it can serve.
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels: {app.kubernetes.io/name: api-gateway}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: api-gateway}
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
