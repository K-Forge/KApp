# KApp as a development server: what the portal's map needs, on any Linux host with Docker, pulled
# from the images .github/workflows/dev-images.yml publishes for one branch. install.sh puts it in
# /opt/kapp; agent.sh keeps it on the branch's latest images. README.md has the whole procedure.
#
# Everything a host needs to say is in /opt/kapp/.env (env.example lists it): the branch, the
# address people open, the database credentials, and how much the host lends. Nothing in this file
# names a host.
#
#   - The map's services always: gateway, auth, map and the portal.
#   - user-service and semaphore-service (users, programs and pensums) only when somebody switches
#     them on: they are the `extras` profile, and `kapp extras on` (kapp.sh) starts them after
#     checking the host has room. The agent switches them off again on its own when the host runs
#     short. No schedule service and no mocks.
#   - Small heaps, the serial GC and the C1 compiler only: each JVM stays at ~200 MB, the four under
#     1 GB and the extras under 560 MB more, so a shared host (the first one also runs a
#     Minecraft server) lends little.
#   - oom_score_adj and cpu_shares make this the first thing the host drops when it runs short, and
#     the last to get the CPU. Both can be set in .env for a host that has room to spare.
#   - Host networking, everything on 127.0.0.1: a host publishes the portal (4300) and the gateway
#     (8080) itself, over HTTPS - install.sh does it with `tailscale serve` when asked to. With no
#     service registry and no Docker DNS on the host network, each service is told where the others
#     listen: the KAPP_*_SERVICE_URL variables below.
#   - No privilege beyond what each process needs: no capabilities for the JVMs, none gained later.
#
# The database is the shared Atlas development cluster: a dev server shows what every laptop shows.

name: kapp-dev

x-kapp: &kapp
  network_mode: host
  restart: unless-stopped
  oom_score_adj: ${KAPP_DEV_OOM_SCORE_ADJ:-1000}
  cpu_shares: ${KAPP_DEV_CPU_SHARES:-128}
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-jvm: &jvm
  <<: *kapp
  cap_drop: [ALL]

services:
  api-gateway:
    <<: *jvm
    image: ${KAPP_DEV_IMAGES:-ghcr.io/k-forge/kapp}-api-gateway:${KAPP_DEV_TAG:?set KAPP_DEV_TAG in .env}
    container_name: kapp-api-gateway
    mem_limit: 288m
    memswap_limit: 288m
    environment:
      SERVER_PORT: 8080
      SERVER_ADDRESS: 127.0.0.1
      KAPP_AUTH_SERVICE_URL: http://127.0.0.1:8081
      KAPP_USER_SERVICE_URL: http://127.0.0.1:8082
      KAPP_SEMAPHORE_SERVICE_URL: http://127.0.0.1:8083
      KAPP_SCHEDULE_SERVICE_URL: http://127.0.0.1:8084
      KAPP_MAP_SERVICE_URL: http://127.0.0.1:8085
      # The portal as people open it: the gateway answers that origin only.
      KAPP_CORS_ORIGINS: ${KAPP_DEV_URL:?set KAPP_DEV_URL in .env}
      KAPP_LOG_LEVEL: INFO
      JAVA_OPTS: "-Xmx96m -XX:MaxDirectMemorySize=48m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:ReservedCodeCacheSize=48m -XX:MaxMetaspaceSize=160m -Xss512k"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 180s

  auth-service:
    <<: *jvm
    image: ${KAPP_DEV_IMAGES:-ghcr.io/k-forge/kapp}-auth-service:${KAPP_DEV_TAG:?set KAPP_DEV_TAG in .env}
    container_name: kapp-auth-service
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      SERVER_PORT: 8081
      SERVER_ADDRESS: 127.0.0.1
      MONGODB_URI: ${MONGO_AUTH_URI:?set it in .env}
      KAPP_JWKS_URI: http://127.0.0.1:8081/.well-known/jwks.json
      KAPP_USER_SERVICE_URL: http://127.0.0.1:8082
      KAPP_LOG_LEVEL: INFO
      # The same keys as the laptops': a token from one works on the other.
      KAPP_JWT_PRIVATE_KEY: ${KAPP_JWT_PRIVATE_KEY:?set it in .env}
      KAPP_JWT_PUBLIC_KEY: ${KAPP_JWT_PUBLIC_KEY:?set it in .env}
      KAPP_INTERNAL_TOKEN: ${KAPP_INTERNAL_TOKEN:?set it in .env}
      KAPP_ALLOWED_EMAIL_DOMAINS: konradlorenz.edu.co,kforge.dev
      KAPP_REQUIRE_EMAIL_VERIFICATION: "false"
      JAVA_OPTS: "-Xmx96m -XX:MaxDirectMemorySize=16m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:ReservedCodeCacheSize=48m -XX:MaxMetaspaceSize=160m -Xss512k"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 180s

  map-service:
    <<: *jvm
    image: ${KAPP_DEV_IMAGES:-ghcr.io/k-forge/kapp}-map-service:${KAPP_DEV_TAG:?set KAPP_DEV_TAG in .env}
    container_name: kapp-map-service
    mem_limit: 352m
    memswap_limit: 352m
    environment:
      SERVER_PORT: 8085
      SERVER_ADDRESS: 127.0.0.1
      MONGODB_URI: ${MONGO_MAP_URI:?set it in .env}
      KAPP_JWKS_URI: http://127.0.0.1:8081/.well-known/jwks.json
      KAPP_LOG_LEVEL: INFO
      # The campus's ground and floor plans weigh more than the others' data.
      JAVA_OPTS: "-Xmx176m -XX:MaxDirectMemorySize=16m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:ReservedCodeCacheSize=48m -XX:MaxMetaspaceSize=160m -Xss512k"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 180s

  # The extras: off unless /opt/kapp/.extras exists (kapp.sh writes it). Registration needs
  # user-service, so it works only while they are on; signing in never does.
  user-service:
    <<: *jvm
    profiles: [extras]
    image: ${KAPP_DEV_IMAGES:-ghcr.io/k-forge/kapp}-user-service:${KAPP_DEV_TAG:?set KAPP_DEV_TAG in .env}
    container_name: kapp-user-service
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      SERVER_PORT: 8082
      SERVER_ADDRESS: 127.0.0.1
      MONGODB_URI: ${MONGO_USER_URI:-}
      KAPP_JWKS_URI: http://127.0.0.1:8081/.well-known/jwks.json
      KAPP_AUTH_SERVICE_URL: http://127.0.0.1:8081
      KAPP_LOG_LEVEL: INFO
      KAPP_INTERNAL_TOKEN: ${KAPP_INTERNAL_TOKEN:?set it in .env}
      JAVA_OPTS: "-Xmx96m -XX:MaxDirectMemorySize=16m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:ReservedCodeCacheSize=48m -XX:MaxMetaspaceSize=160m -Xss512k"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 180s

  semaphore-service:
    <<: *jvm
    profiles: [extras]
    image: ${KAPP_DEV_IMAGES:-ghcr.io/k-forge/kapp}-semaphore-service:${KAPP_DEV_TAG:?set KAPP_DEV_TAG in .env}
    container_name: kapp-semaphore-service
    mem_limit: 288m
    memswap_limit: 288m
    environment:
      SERVER_PORT: 8083
      SERVER_ADDRESS: 127.0.0.1
      MONGODB_URI: ${MONGO_SEMAPHORE_URI:-}
      KAPP_JWKS_URI: http://127.0.0.1:8081/.well-known/jwks.json
      KAPP_LOG_LEVEL: INFO
      # The programs' catalogue and every pensum's grid weigh a little more than a profile.
      JAVA_OPTS: "-Xmx112m -XX:MaxDirectMemorySize=16m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:CICompilerCount=1 -XX:ReservedCodeCacheSize=48m -XX:MaxMetaspaceSize=160m -Xss512k"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 180s

  # nginx listens on 80 in its image, which with host networking would be the host's port 80: it is
  # moved to 127.0.0.1:4300 at start, the rest of its configuration untouched. Its master process
  # needs its default capabilities to hand the workers to the nginx user.
  web-admin:
    <<: *kapp
    image: ${KAPP_DEV_IMAGES:-ghcr.io/k-forge/kapp}-web-admin:${KAPP_DEV_TAG:?set KAPP_DEV_TAG in .env}
    container_name: kapp-web-admin
    mem_limit: 48m
    memswap_limit: 48m
    command: ["sh", "-c", "sed -i 's/listen 80;/listen 127.0.0.1:4300;/' /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4300/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
