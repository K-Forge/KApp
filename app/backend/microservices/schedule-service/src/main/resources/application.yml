server:
  port: ${SERVER_PORT:8084}
  # Makes springdoc emit gateway-relative server URLs instead of this container's own
  # host, so "Try it out" in the aggregated Swagger UI goes through the gateway.
  forward-headers-strategy: framework

spring:
  application:
    name: schedule-service

  security:
    oauth2:
      resourceserver:
        jwt:
          # MUST be jwk-set-uri, never issuer-uri. issuer-uri performs OIDC discovery
          # while the bean is created, so this service would refuse to start unless
          # auth-service were already up - a boot-order deadlock under docker compose.
          jwk-set-uri: ${KAPP_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

  # The catalogue (pensumCourses) and the building of each sede (sedeBuildings): reference data
  # that changes rarely, kept a few minutes so a timetable does not cost two more calls.
  cache:
    cache-names: pensumCourses,sedeBuildings
    caffeine:
      spec: expireAfterWrite=5m,maximumSize=1000

# Fail fast rather than let a slow neighbour stall a timetable: both lookups fail open.
feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000

kapp:
  sinu:
    # Which SINU the timetables are read from. `fake` serves the invented timetables of
    # docs/api/sinu/ while the university has not opened SINU; there is no other adapter yet.
    adapter: ${KAPP_SINU_ADAPTER:fake}
  schedule:
    # A timetable read from SINU is kept this long, and no longer: nothing academic is stored.
    timetable-cache: ${KAPP_TIMETABLE_CACHE:5m}
    # The university's clock: which day it is decides the current period and the current week.
    zone: ${KAPP_SCHEDULE_ZONE:America/Bogota}
    # Where its neighbours answer. By name: Docker Compose and Kubernetes both resolve a
    # service's name to its address, so no registry is needed. A host-networked server or a
    # local run sets the address itself.
    semaphore-service-url: ${KAPP_SEMAPHORE_SERVICE_URL:http://semaphore-service:8083}
    map-service-url: ${KAPP_MAP_SERVICE_URL:http://map-service:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    co.edu.konradlorenz.kapp: ${KAPP_LOG_LEVEL:INFO}
