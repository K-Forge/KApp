# KApp backend - local orchestration.
#
# Nothing here is a production deployment: it is the six-container stack that has to fit
# on a 16 GB laptop next to Xcode and Android Studio, plus the Prism mocks that let the
# mobile team work before any JVM exists.
#
# THE DATABASE IS NOT HERE. Every service reaches the shared Atlas cluster through its own
# MONGO_*_URI, which .env must provide - see docs/ATLAS-SETUP.md. Nothing local to start,
# seed or keep in step, and nobody debugging their own copy of the data. The price is that
# this stack needs the network and that a destructive experiment is everybody's;
# docs/adr/0009-atlas-is-the-only-development-database.md records the trade. The tests are
# the exception and always will be: they start their own MongoDB through Testcontainers, so
# a test run cannot touch what the team is looking at.
#
# Profiles (never run all of them unless you mean to):
#
#   docker compose --profile mock      up -d   # Prism mocks only. No JVM.
#   docker compose --profile core      up -d   # discovery, gateway, auth, user
#   docker compose --profile academic  up -d   # core + semaphore + schedule
#   docker compose --profile map       up -d   # core + map
#   docker compose --profile full      up -d   # everything, mocks included
#   docker compose --profile dev       up -d   # the admin portal
#
# The shared services (discovery-server, api-gateway, auth-service, user-service)
# list every non-mock profile, so any of `core`/`academic`/`map`/`full` brings them up.
# That is deliberate: it keeps `depends_on` inside the set of services the activated
# profile actually starts, which is the case Compose refuses to resolve otherwise.
#
# Published host ports (defaults; every one is overridable - see KAPP_STACK below):
#
#   8080         api-gateway   the only JVM port on the host - see the note below
#   4300         web-admin     the admin portal, with the `dev` profile
#   4010-4014    Prism mocks   auth, user, semaphore, schedule, map (in that order)
#
# ---------------------------------------------------------------------------------------------
# KAPP_STACK - which checkout this stack belongs to. Set it in this directory's .env.
#
#   back (default)   the backend worktree          front / web      the portal worktree
#   swift            the iOS worktree              kotlin           the Android worktree
#
# It names every container (`back-auth-service`, `swift-auth-service-mock`) and every image tag
# (`kapp/auth-service:back`). Both used to be fixed and shared across worktrees, and that cost us
# twice in one week: two stacks fought over ports 8080 and 4300 until neither was reachable, and a
# stack silently ran an image another worktree had just rebuilt from a different branch - which
# applied that branch's migrations to the shared Atlas cluster.
#
# The Compose PROJECT stays `kapp`, so every stack still appears under one heading in Docker
# Desktop. That is also why two stacks that run the same services - two backends, say - still
# collide: Compose tracks a service by project plus service name, so starting one recreates the
# other's containers. The mocks are safe, because they are different services. If you genuinely
# need two backends at once, give one of them KAPP_PROJECT=kapp-<something> as well.
#
# Two stacks at once also need different ports. Set these in the same .env:
#
#   KAPP_GATEWAY_PORT   KAPP_PORTAL_PORT
#   KAPP_MOCK_AUTH_PORT   KAPP_MOCK_USER_PORT   KAPP_MOCK_SEMAPHORE_PORT
#   KAPP_MOCK_SCHEDULE_PORT   KAPP_MOCK_MAP_PORT
#
# The mobile worktrees run only `--profile mock`, so KAPP_STACK is all they need:
#
#   echo 'KAPP_STACK=swift' >> app/backend/microservices/.env
#   pnpm run microservices:mock          # -> swift-auth-service-mock, and so on
#
# docs/RUNBOOK.md has the whole procedure, including what to do the first time after this change.
# ---------------------------------------------------------------------------------------------
#
# `version:` is intentionally absent - the Compose Specification dropped it and v2 warns.

name: ${KAPP_PROJECT:-kapp}

services:
  # ---------------------------------------------------------------------------------
  # Eureka. No host port: the registry is an internal concern, and exposing it hands
  # anyone on the LAN a map of the internal topology.
  # ---------------------------------------------------------------------------------
  discovery-server:
    build:
      # Context is the REACTOR ROOT for every service - the parent pom and the Maven
      # wrapper live here, not in the service directory. See user-service/Dockerfile.
      context: .
      dockerfile: discovery-server/Dockerfile
    image: kapp/discovery-server:${KAPP_STACK:-back}
    container_name: ${KAPP_STACK:-back}-discovery-server
    profiles: ["core", "academic", "map", "full"]
    mem_limit: 512m
    healthcheck:
      # The images are Alpine JRE - there is no curl, only BusyBox wget.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      # Spring Boot on a laptop with seven containers competing for CPU needs 30-60s.
      # A short start_period marks the container unhealthy before it has finished boot
      # and takes the whole dependency chain down with it.
      start_period: 60s
    networks: [kapp]

  # ---------------------------------------------------------------------------------
  # The ONLY service published to the host. Everything else talks over the `kapp`
  # network by service name.
  #
  # Security finding S1: the previous compose published 8081-8085, so any client could
  # address a service directly and skip the gateway's authentication and rate limiting
  # entirely. Unpublishing those ports is half the fix; the other half is the services
  # validating the JWT themselves.
  # ---------------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: kapp/api-gateway:${KAPP_STACK:-back}
    container_name: ${KAPP_STACK:-back}-api-gateway
    profiles: ["core", "academic", "map", "full"]
    ports:
      - "${KAPP_GATEWAY_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_URI: http://discovery-server:8761/eureka/
      EUREKA_ENABLED: "true"
      KAPP_CORS_ORIGINS: ${KAPP_CORS_ORIGINS:-http://localhost:4300,http://localhost:4200,http://localhost:5173}
      KAPP_LOG_LEVEL: ${KAPP_LOG_LEVEL:-INFO}
    depends_on:
      discovery-server:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [kapp]

  # ---------------------------------------------------------------------------------
  # auth-service - signs RS256 access tokens and publishes the public half at
  # /.well-known/jwks.json, which every other service reads. It has no host port: it is
  # reached through the gateway.
  # ---------------------------------------------------------------------------------
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: kapp/auth-service:${KAPP_STACK:-back}
    container_name: ${KAPP_STACK:-back}-auth-service
    profiles: ["core", "academic", "map", "full"]
    environment:
      SERVER_PORT: 8081
      # The whole connection string in one variable, and no default: each service reaches
      # the cluster with its OWN account, which has readWrite on its OWN database. Compose
      # refuses to start rather than fall back to something that is not the cluster.
      MONGODB_URI: ${MONGO_AUTH_URI:?set it in .env - docs/ATLAS-SETUP.md}
      # Points at itself - auth-service validates the tokens it issues.
      KAPP_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      EUREKA_URI: http://discovery-server:8761/eureka/
      EUREKA_ENABLED: "true"
      KAPP_LOG_LEVEL: ${KAPP_LOG_LEVEL:-INFO}
      # Blank is allowed: auth-service then generates an ephemeral RS256 pair and warns.
      # That is fine for a laptop and wrong everywhere else - a restart invalidates every
      # token already issued, including the ones in the mobile clients' keychains.
      KAPP_JWT_PRIVATE_KEY: ${KAPP_JWT_PRIVATE_KEY:-}
      KAPP_JWT_PUBLIC_KEY: ${KAPP_JWT_PUBLIC_KEY:-}
      # The default is deliberately not secret-shaped. `${VAR:?}` would be stricter, but
      # Compose interpolates the whole file before it filters by profile, so a required
      # variable here would also stop `--profile mock` - the one path that is supposed to
      # need no setup at all. An obviously-invalid placeholder is the compromise: it is
      # unmistakable in a log or a deployed config. Set the real value in .env.
      KAPP_INTERNAL_TOKEN: ${KAPP_INTERNAL_TOKEN:-CHANGE_ME_UNSET_INTERNAL_TOKEN}

      # Registration gating. Only this domain may use /auth/register; guests are
      # unrestricted and land on ROLE_GUEST.
      KAPP_ALLOWED_EMAIL_DOMAINS: ${KAPP_ALLOWED_EMAIL_DOMAINS:-konradlorenz.edu.co,kforge.dev}

      # Off by default because there is no SMTP relay yet, and registration is the front
      # door of the product: requiring an e-mail nobody can send would block the four
      # mobile developers and every tester. Accounts are created ACTIVE, while
      # emailVerified stays false because nothing was actually verified.
      # Turn this on the moment mail works.
      KAPP_REQUIRE_EMAIL_VERIFICATION: ${KAPP_REQUIRE_EMAIL_VERIFICATION:-false}
      KAPP_VERIFICATION_LINK_BASE: ${KAPP_VERIFICATION_LINK_BASE:-http://localhost:8080/auth/verify}

      # Leave SPRING_MAIL_HOST blank and verification e-mails are written to the log
      # instead of sent, which is what makes the flag above safe to turn on locally.
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    depends_on:
      discovery-server:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [kapp]

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    image: kapp/user-service:${KAPP_STACK:-back}
    container_name: ${KAPP_STACK:-back}-user-service
    profiles: ["core", "academic", "map", "full"]
    environment:
      SERVER_PORT: 8082
      MONGODB_URI: ${MONGO_USER_URI:?set it in .env - docs/ATLAS-SETUP.md}
      KAPP_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      EUREKA_URI: http://discovery-server:8761/eureka/
      EUREKA_ENABLED: "true"
      KAPP_LOG_LEVEL: ${KAPP_LOG_LEVEL:-INFO}
      # Shared secret guarding POST /internal/users, which auth-service calls during
      # registration. Both sides must hold the same value.
      KAPP_INTERNAL_TOKEN: ${KAPP_INTERNAL_TOKEN:-CHANGE_ME_UNSET_INTERNAL_TOKEN}
    depends_on:
      discovery-server:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [kapp]

  # ---------------------------------------------------------------------------------
  # Academic profile. Someone working on the semaphore does not need the map running.
  # ---------------------------------------------------------------------------------
  semaphore-service:
    build:
      context: .
      dockerfile: semaphore-service/Dockerfile
    image: kapp/semaphore-service:${KAPP_STACK:-back}
    container_name: ${KAPP_STACK:-back}-semaphore-service
    profiles: ["academic", "full"]
    environment:
      SERVER_PORT: 8083
      MONGODB_URI: ${MONGO_SEMAPHORE_URI:?set it in .env - docs/ATLAS-SETUP.md}
      KAPP_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      EUREKA_URI: http://discovery-server:8761/eureka/
      EUREKA_ENABLED: "true"
      KAPP_LOG_LEVEL: ${KAPP_LOG_LEVEL:-INFO}
    depends_on:
      discovery-server:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [kapp]

  schedule-service:
    build:
      context: .
      dockerfile: schedule-service/Dockerfile
    image: kapp/schedule-service:${KAPP_STACK:-back}
    container_name: ${KAPP_STACK:-back}-schedule-service
    profiles: ["academic", "full"]
    environment:
      SERVER_PORT: 8084
      MONGODB_URI: ${MONGO_SCHEDULE_URI:?set it in .env - docs/ATLAS-SETUP.md}
      KAPP_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      EUREKA_URI: http://discovery-server:8761/eureka/
      EUREKA_ENABLED: "true"
      KAPP_LOG_LEVEL: ${KAPP_LOG_LEVEL:-INFO}
    depends_on:
      discovery-server:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [kapp]

  map-service:
    build:
      context: .
      dockerfile: map-service/Dockerfile
    image: kapp/map-service:${KAPP_STACK:-back}
    container_name: ${KAPP_STACK:-back}-map-service
    profiles: ["map", "full"]
    environment:
      SERVER_PORT: 8085
      MONGODB_URI: ${MONGO_MAP_URI:?set it in .env - docs/ATLAS-SETUP.md}
      KAPP_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      EUREKA_URI: http://discovery-server:8761/eureka/
      EUREKA_ENABLED: "true"
      KAPP_LOG_LEVEL: ${KAPP_LOG_LEVEL:-INFO}
    depends_on:
      discovery-server:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [kapp]

  # ---------------------------------------------------------------------------------
  # Prism mock servers, one per published OpenAPI contract.
  #
  # This is the whole point of the `mock` profile: four mobile developers can build
  # against the real contracts on day one with no JVM, no Mongo and no build. Prism
  # serves the examples in the spec, so the shapes are the ones the services will
  # return. Keep them out of every other profile so `--profile mock` stays JVM-free.
  #
  # The specs live at the REPO ROOT (docs/api), three levels above this file, and are
  # mounted read-only - the contracts are owned elsewhere and must not be edited here.
  # Prism listens on 4010 inside each container; the host ports differ per service:
  #
  #   4010 auth   4011 user   4012 semaphore   4013 schedule   4014 map
  # ---------------------------------------------------------------------------------
  mock-auth:
    image: stoplight/prism:4
    # stoplight/prism publishes linux/amd64 only, so this runs under Rosetta on Apple
    # Silicon. Stating the platform keeps Docker from warning on every `up`; a Node
    # process serving canned examples is not something emulation makes slow enough to
    # notice. Declared per service because Compose has no file-level default.
    platform: linux/amd64
    container_name: ${KAPP_STACK:-back}-auth-service-mock
    profiles: ["mock", "full"]
    command: mock -h 0.0.0.0 /specs/auth.openapi.yaml
    ports:
      - "${KAPP_MOCK_AUTH_PORT:-4010}:4010"
    volumes:
      - ../../../docs/api:/specs:ro
    mem_limit: 256m
    networks: [kapp]

  mock-user:
    image: stoplight/prism:4
    # linux/amd64 only - see the note on mock-auth.
    platform: linux/amd64
    container_name: ${KAPP_STACK:-back}-user-service-mock
    profiles: ["mock", "full"]
    command: mock -h 0.0.0.0 /specs/user.openapi.yaml
    ports:
      - "${KAPP_MOCK_USER_PORT:-4011}:4010"
    volumes:
      - ../../../docs/api:/specs:ro
    mem_limit: 256m
    networks: [kapp]

  mock-semaphore:
    image: stoplight/prism:4
    # linux/amd64 only - see the note on mock-auth.
    platform: linux/amd64
    container_name: ${KAPP_STACK:-back}-semaphore-service-mock
    profiles: ["mock", "full"]
    command: mock -h 0.0.0.0 /specs/semaphore.openapi.yaml
    ports:
      - "${KAPP_MOCK_SEMAPHORE_PORT:-4012}:4010"
    volumes:
      - ../../../docs/api:/specs:ro
    mem_limit: 256m
    networks: [kapp]

  mock-schedule:
    image: stoplight/prism:4
    # linux/amd64 only - see the note on mock-auth.
    platform: linux/amd64
    container_name: ${KAPP_STACK:-back}-schedule-service-mock
    profiles: ["mock", "full"]
    command: mock -h 0.0.0.0 /specs/schedule.openapi.yaml
    ports:
      - "${KAPP_MOCK_SCHEDULE_PORT:-4013}:4010"
    volumes:
      - ../../../docs/api:/specs:ro
    mem_limit: 256m
    networks: [kapp]

  mock-map:
    image: stoplight/prism:4
    # linux/amd64 only - see the note on mock-auth.
    platform: linux/amd64
    container_name: ${KAPP_STACK:-back}-map-service-mock
    profiles: ["mock", "full"]
    command: mock -h 0.0.0.0 /specs/map.openapi.yaml
    ports:
      - "${KAPP_MOCK_MAP_PORT:-4014}:4010"
    volumes:
      - ../../../docs/api:/specs:ro
    mem_limit: 256m
    networks: [kapp]

  # ---------------------------------------------------------------------------------
  # web-admin - the internal admin/dev portal (Angular), containerised so nobody has to run
  # `pnpm install` to use it. Its own profile, not part of `core`/`academic`/`map`/`full`: it is
  # a frontend tool a developer opts into, not a backend dependency anything else here needs.
  #
  #   docker compose --profile dev up -d
  #
  # Host port 4300: 8080, 8761, 27017 and 4010-4014 are already taken in this file, and 4200 is
  # what `pnpm start` binds for local development of the portal itself - a distinct port lets the
  # containerised portal and a local `pnpm start` run side by side instead of one having to be
  # stopped to try the other.
  # ---------------------------------------------------------------------------------
  web-admin:
    build:
      # Context is the REPO ROOT, not app/frontend/web-admin - see the note atop its Dockerfile.
      # The build needs docs/api (bundled as JSON at build time for the API console and role
      # inspector), the same specs the Prism mocks above read.
      context: ../../..
      dockerfile: app/frontend/web-admin/Dockerfile
    image: kapp/web-admin:${KAPP_STACK:-back}
    container_name: ${KAPP_STACK:-back}-web-admin
    profiles: ["dev"]
    ports:
      - "${KAPP_PORTAL_PORT:-4300}:80"
    healthcheck:
      # 127.0.0.1, not localhost: this custom server block only listens on IPv4, and Alpine's
      # resolver tries the ::1 (IPv6) loopback first, so `localhost` reliably fails here even
      # though nginx is up and answering fine - a real gotcha the backend services don't hit
      # because their JRE images resolve `localhost` differently.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [kapp]


networks:
  kapp:
    driver: bridge
