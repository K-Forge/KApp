# The mocks behind one port, routed as api-gateway routes the real services
# (api-gateway/.../config/GatewayConfig.java). A client points at one base URL and switches between
# the mocks and a real gateway by changing only that URL.
#
# Upstreams are resolved per request through Docker's DNS, so the gateway starts even while a mock
# is still starting, and answers 502 for that one until it is up.
server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $auth      http://mock-auth:4010;
    set $user      http://mock-user:4010;
    set $semaphore http://mock-semaphore:4010;
    set $schedule  http://mock-schedule:4010;
    set $map       http://mock-map:4010;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /auth/                 { proxy_pass $auth; }
    location = /.well-known/jwks.json { proxy_pass $auth; }
    location /api/users             { proxy_pass $user; }
    location /api/semaphore/        { proxy_pass $semaphore; }
    location /api/catalog/          { proxy_pass $semaphore; }
    location /api/schedule/         { proxy_pass $schedule; }
    location /api/map/              { proxy_pass $map; }

    location / {
        default_type application/json;
        return 404 '{"status":404,"error":"Not Found","message":"No mock serves this path. The routes are those of the real gateway: /auth, /api/users, /api/semaphore, /api/catalog, /api/schedule and /api/map."}';
    }
}
