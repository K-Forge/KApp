server:
  port: ${SERVER_PORT:8081}
  # Makes springdoc emit gateway-relative server URLs instead of this container's own
  # host, so "Try it out" in the aggregated Swagger UI goes through the gateway.
  forward-headers-strategy: framework

spring:
  application:
    name: auth-service

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/kapp_auth}
      auto-index-creation: false   # indexes are declared in Mongock change units

  security:
    oauth2:
      resourceserver:
        jwt:
          # MUST be jwk-set-uri, never issuer-uri. issuer-uri performs OIDC discovery
          # while the bean is created, so this service would refuse to start unless
          # auth-service were already up - a boot-order deadlock under docker compose.
          jwk-set-uri: ${KAPP_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

  # Blank host is the local-dev default: VerificationMailer switches to logging the
  # link instead of sending it, which is what makes KAPP_REQUIRE_EMAIL_VERIFICATION=true
  # safe to turn on before an SMTP relay exists.
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mongock:
  migration-scan-package: co.edu.konradlorenz.kapp.auth.migration
  # Left off deliberately: the change units only create indexes, which are idempotent,
  # and enabling transactions requires a MongoTransactionManager bean.
  # Property is `transactional`; `transaction-enabled` is deprecated in Mongock 5.5.
  transactional: false

management:
  health:
    mail:
      # Spring contributes a mail health indicator whenever spring-boot-starter-mail is
      # on the classpath, and it opens a real SMTP connection. Mail is optional here by
      # design - there is no relay yet, and verification sits behind a flag - so an
      # absent mail server must not make a service that is answering requests correctly
      # report itself unhealthy and get restarted.
      enabled: ${SPRING_MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    co.edu.konradlorenz.kapp: ${KAPP_LOG_LEVEL:INFO}

kapp:
  # Shared secret for the one Feign call this service makes: POST /internal/users on
  # user-service, during registration. See InternalUserClientConfig.
  internal:
    token: ${KAPP_INTERNAL_TOKEN:}

  auth:
    jwt:
      # Base64-encoded PEM. Leave blank locally and an ephemeral pair is generated,
      # with a warning: every restart then invalidates all tokens already issued.
      private-key: ${KAPP_JWT_PRIVATE_KEY:}
      public-key: ${KAPP_JWT_PUBLIC_KEY:}
      key-id: ${KAPP_JWT_KEY_ID:kapp-signing-key}
      ttl: ${KAPP_JWT_TTL:1h}
      issuer: ${KAPP_JWT_ISSUER:https://kapp.konradlorenz.edu.co}

    # Where user-service answers. By name: Docker Compose and Kubernetes both resolve a
    # service's name to its address, so no registry is needed. A host-networked server or a
    # local run sets the address itself.
    user-service-url: ${KAPP_USER_SERVICE_URL:http://user-service:8082}

    # Registration and e-mail verification. See RegistrationProperties.
    allowed-email-domains: ${KAPP_ALLOWED_EMAIL_DOMAINS:konradlorenz.edu.co,kforge.dev}
    # Off by default: there is no SMTP relay yet, and registration is the front door
    # of the product. Accounts are then created ACTIVE while emailVerified stays
    # false, because nothing was actually verified. Turn this on the moment mail works.
    require-email-verification: ${KAPP_REQUIRE_EMAIL_VERIFICATION:false}
    verification-link-base: ${KAPP_VERIFICATION_LINK_BASE:http://localhost:8080/auth/verify}
    verification-ttl: ${KAPP_VERIFICATION_TTL:24h}
    mail-from: ${KAPP_MAIL_FROM:no-reply@konradlorenz.edu.co}
