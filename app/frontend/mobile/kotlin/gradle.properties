org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Parallel sync, Gradle 9.4+
org.gradle.tooling.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Nothing else belongs in here. Every other android.* flag pins behaviour from before AGP 9,
# and each one is already deprecated: AGP 10 removes them and the build stops with them in
# place. The Upgrade Assistant writes a dozen of them to keep a project compiling unchanged,
# so after an AGP upgrade take them out again and fix what actually breaks.

kotlin.code.style=official
