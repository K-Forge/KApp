# The portal's security headers, included in every location of nginx.conf (#145).
#
# Every location there sets a header of its own, and nginx then drops whatever the server block
# set: a header left at the server level would reach no response at all. Hence one file, included
# in each location, and scripts/check-security-headers.mjs, which fails `pnpm test` when a location
# leaves it out.
#
# Why it matters here: the access token and the refresh token live in localStorage, where any
# script on this origin can read them. The policy lets only the portal's own bundle run.
#
# - script-src 'self': the one module the build emits. No inline script, no inline handler; that
#   is also why angular.json turns off the critical-CSS inlining, whose stylesheet loads with an
#   inline onload.
# - style-src 'unsafe-inline': Angular puts each component's styles in a <style> of its own.
# - connect-src: the gateway, which the portal calls at its own host on port 8080 (http behind a
#   proxy, https in the browser, so both), and any tailnet host's, since a proxy such as
#   `tailscale serve` may not pass the browser's host on; any port of localhost, for the stacks on
#   a laptop and the fake OIDC server; and Microsoft's sign-in, for the discovery document and the
#   token endpoint. A gateway typed into the "Gateway" box elsewhere is refused: this is why.
# - frame-ancestors 'none': nobody frames the portal to click through it.
# - Referrer-Policy no-referrer: the callback's address carries the authorization code.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://$host:8080 https://$host:8080 https://*.ts.net:8080 http://localhost:* http://127.0.0.1:* https://login.microsoftonline.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
