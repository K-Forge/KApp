# Serves the built Angular app as a single-page app: any path that isn't a real static file
# falls back to index.html so the client-side router (not nginx) decides what to render. Without
# this, refreshing on e.g. /data/buildings would 404 at the server instead of reaching Angular.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build output only. The filename carries a content hash - main-7DW7ED5D.js,
    # styles-U2YVI3M3.css - so it changes whenever the contents do and can be cached forever
    # without ever serving a stale one.
    #
    # This rule used to match every .js .css .png .svg .ico, hashed or not, and that was wrong
    # in a way that takes a year to expire: favicon.ico and konrad-logo.png come out of public/
    # with fixed names, so a browser that fetched one once was told to keep it, immutably, and
    # never ask again. Replacing the favicon changed nothing on any machine that had already
    # loaded the old one.
    location ~* "-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?|png|jpg|jpeg|svg|webp)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Everything else static: a fixed name, so it has to be revalidated. `no-cache` does not
    # mean "do not cache" - it means "ask first", and nginx answers 304 from the ETag when
    # nothing changed, which costs one small round trip and never serves a stale icon.
    location ~* \.(?:ico|png|jpg|jpeg|svg|webp|woff2?|js|css|json|txt)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;

        # index.html must NOT be cached. It is the one file with a stable name, and it is what
        # names the hashed bundles - so a cached copy keeps loading the previous build's
        # JavaScript after a deploy. With no Cache-Control at all a browser applies heuristic
        # caching and does exactly that; it cost an hour of debugging a fix that was already
        # deployed and simply was not being loaded.
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Plain liveness check for the compose healthcheck - nginx being up is the whole story here,
    # there is no backend of its own to report on.
    location = /health {
        add_header Content-Type text/plain;
        include /etc/nginx/security-headers.conf;
        return 200 'OK';
    }
}
