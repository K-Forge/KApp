name: Dev images

# Every push that touches what the dev server runs builds that service's image for the branch and
# publishes it to GHCR, for amd64 and arm64: ghcr.io/k-forge/kapp-<service>:<branch>. A dev server
# follows one branch - deploy/dev-server/agent.sh pulls the branch's images every few minutes,
# checks they were built from that branch and restarts what changed.
#
# Nothing here reaches a server and no secret is used but the job's own token to write the
# packages: the images are built from this public repository and carry nothing private. The
# database credentials live on the server, in its .env, and nowhere else.

on:
  push:
    branches-ignore: ['dependabot/**']
    paths:
      - 'app/backend/microservices/**'
      - 'app/frontend/web-admin/**'
      - 'docs/api/**'
      - '.github/workflows/dev-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push supersedes an older one on the same branch: its images are the ones wanted.
concurrency:
  group: dev-images-${{ github.ref }}
  cancel-in-progress: true

env:
  # What a dev server runs (deploy/dev-server/compose.yaml), the extras included: they are off
  # until switched on, but their images have to be there. A service added there is added here.
  SERVICES: api-gateway auth-service map-service web-admin user-service semaphore-service

jobs:
  plan:
    name: Which images changed
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.plan.outputs.services }}
      tag: ${{ steps.plan.outputs.tag }}
      image: ${{ steps.plan.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Everything from the event goes through env, never through ${{ }} inside run: a branch name is
      # text anyone who can push controls, and interpolating it is a shell injection.
      - name: Plan
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # An image tag: lower case, no slashes. feature/campus-map -> feature-campus-map.
          tag=$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g' | cut -c1-120)
          image="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/kapp"

          # The files this push changed. A new branch, a forced push or a manual run builds everything.
          if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             && [[ "$GITHUB_EVENT_NAME" == push ]]; then
            files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          else
            files=ALL
          fi

          build=()
          for s in $SERVICES; do
            if [[ "$files" == ALL ]]; then build+=("$s"); continue; fi
            if [[ "$s" == web-admin ]]; then
              pattern='^(app/frontend/web-admin/|docs/api/)'
            else
              # The reactor root is every JVM service's build context: its pom, wrapper and common
              # module change them all.
              pattern="^app/backend/microservices/($s/|common/|pom\.xml|\.mvn/|mvnw)"
            fi
            if grep -qE "$pattern|^\.github/workflows/dev-images\.yml$" <<<"$files"; then
              build+=("$s")
            elif ! docker buildx imagetools inspect "$image-$s:$tag" >/dev/null 2>&1; then
              # Nothing of it changed, but the branch has no image of it yet: a branch older than this
              # workflow, or one whose first build failed.
              build+=("$s")
            fi
          done

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "services=$(printf '%s\n' "${build[@]}" | jq -R . | jq -cs 'map(select(length > 0))')" >> "$GITHUB_OUTPUT"
          echo "Building for $tag: ${build[*]:-nothing}"

  build:
    name: Build ${{ matrix.service }} (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}
        platform: [amd64, arm64]
    # Each platform on its own kind of machine, so nothing is emulated: the arm64 runners are free for
    # public repositories, and the Maven build under QEMU would take the better part of an hour.
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Where it is built
        id: where
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          # The portal's context is the repository root (it bundles docs/api); a service's, the reactor root.
          if [[ "$SERVICE" == web-admin ]]; then
            echo "context=." >> "$GITHUB_OUTPUT"
            echo "file=app/frontend/web-admin/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "context=app/backend/microservices" >> "$GITHUB_OUTPUT"
            echo "file=app/backend/microservices/$SERVICE/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      # Pushed by digest only: the tag is put on once both platforms are in, by the publish job.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.where.outputs.context }}
          file: ${{ steps.where.outputs.file }}
          platforms: linux/${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ needs.plan.outputs.image }}-${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.platform }}

      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.service }}
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.service }}-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One tag for the branch, which the dev server follows, and one for the commit, to go back to.
      - name: Tag both platforms together
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.plan.outputs.image }}-${{ matrix.service }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:sha-${GITHUB_SHA::7}" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$TAG"
