name: Restack probe (touched after the stack branched)

# Throwaway, lives only on test/restack-base: proves that a push made by the restack App
# triggers pull_request workflows, which a push with the job's own token would not.
on:
  pull_request:
    types: [synchronize]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          ACTOR: ${{ github.actor }}
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: echo "synchronize on $HEAD pushed by $ACTOR"
