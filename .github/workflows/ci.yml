name: CI

on:
  push:
    # develop is the integration branch - the previous workflow watched main only, so
    # everything merged into develop went unbuilt until release time.
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # The merge queue tests each pull request on top of the ones queued before it, and only merges what
  # passes. Without this trigger the required checks never report on the queue's branch and it waits forever.
  merge_group:

# Read-only by default. No job here publishes anything; a token that cannot write is
# one less thing an untrusted pull request can abuse.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts of the repository a change touches, so a docs pull request does not rebuild the backend,
  # the Android client and the portal. A job that is skipped counts as passed for the rulesets' required
  # checks, so skipping is safe. Every push to main or develop still runs everything, and so does any
  # change to this file. If this job itself fails, every job runs: a broken filter must never skip a build.
  changes:
    name: Which parts changed
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      contracts: ${{ steps.paths.outputs.contracts }}
      pensums: ${{ steps.paths.outputs.pensums }}
      android: ${{ steps.paths.outputs.android }}
      portal: ${{ steps.paths.outputs.portal }}

    steps:
      # Full history but no file contents: enough for git diff --name-only, in seconds.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Match the changed paths
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          case $EVENT in
            pull_request) files=$(git diff --name-only "$PR_BASE...$PR_HEAD") ;;
            merge_group) files=$(git diff --name-only "$QUEUE_BASE" "$QUEUE_HEAD") ;;
            *) files='' ;;
          esac
          printf '%s\n' "$files" | sed 's/^/changed: /'

          # Each job and the paths it reads. The backend's tests and the portal's build both read the
          # contracts in docs/api, so a contract change runs them too.
          touched() {
            [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ] || return 0
            printf '%s\n' "$files" | grep -qE "^(\.github/workflows/ci\.yml|$1)" && return 0
            return 1
          }
          out() { if touched "$2"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          out backend   'app/backend/|docs/api/'
          out contracts 'docs/api/'
          out pensums   'docs/pensums/|app/backend/microservices/semaphore-service/src/main/resources/db/seed/pensums/'
          out android   'app/frontend/mobile/kotlin/'
          out portal    'app/frontend/web-admin/|docs/api/|package\.json|pnpm-lock\.yaml'
          cat "$GITHUB_OUTPUT"

  backend:
    name: Build and test microservices (JDK 21)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The integration tests run MongoDB through Testcontainers, so the build needs a
      # working Docker daemon. ubuntu-latest runners ship one and the runner user is in
      # the docker group, so nothing has to be installed or started here. A container-
      # based or self-hosted runner without Docker would fail at the first @Testcontainers
      # class, not at compile time.
      #
      # ./mvnw, not mvn: the wrapper pins the Maven version, so CI and laptops run the
      # same build. `verify` is what actually executes the tests - `package` does not.
      - name: Build and test
        working-directory: app/backend/microservices
        run: ./mvnw -B -ntp verify

      # Only on failure: on a green build nobody reads these, and they are megabytes.
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: app/backend/microservices/**/target/surefire-reports/**
          retention-days: 7
          if-no-files-found: ignore

  openapi:
    name: Lint OpenAPI contracts
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.contracts == 'true') }}
    runs-on: ubuntu-latest

    # Independent of the Java build on purpose: the specs are the contract the mobile
    # team and the Prism mocks build against, so they must be checked even when the
    # backend build is broken.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # @redocly/cli exposes more than one bin, so a bare `npx @redocly/cli@latest`
      # cannot pick one and errors out. --package names the package, `redocly` the bin.
      - name: Lint specs
        run: npx --package=@redocly/cli@latest redocly lint docs/api/*.yaml

  pensum-seed:
    name: Pensum seed matches its transcriptions
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.pensums == 'true') }}
    runs-on: ubuntu-latest

    # The seed under db/seed/pensums/ is generated from docs/pensums/transcriptions/. Editing a
    # transcription and forgetting to regenerate already shipped a wrong area name once, and a
    # seed only a migration reads is not something a reviewer notices by eye.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Regenerate and compare
        run: |
          python3 docs/pensums/tools/build_seed.py
          git diff --exit-code -- app/backend/microservices/semaphore-service/src/main/resources/db/seed/pensums \
            || { echo "::error::The pensum seed is out of date. Run docs/pensums/tools/build_seed.py and commit the result."; exit 1; }

  android:
    name: Build and test the android client (JDK 25)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.android == 'true') }}
    runs-on: ubuntu-latest

    # Nothing built the Android client until this job existed: it reached develop with four green
    # checks, none of which compiled a line of Kotlin. The client is the product, so a broken build
    # has to fail here rather than on the next person's laptop.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 25, not 21 like the backend: gradle/gradle-daemon-jvm.properties asks the daemon for a
      # Java 25 toolchain. Anything else and Gradle stops to provision one on every run.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # Caches ~/.gradle between runs and checks the committed wrapper jar against the published
      # checksums - the jar is the one file in the repository that runs before anyone reads it.
      # The runner already ships the Android SDK with its licences accepted, so nothing installs it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # lint too: it is what catches a resource or manifest mistake that still compiles.
      - name: Build, test and lint
        working-directory: app/frontend/mobile/kotlin
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: app/frontend/mobile/kotlin/app/build/reports/**
          retention-days: 7
          if-no-files-found: ignore

  portal:
    name: Build and test the admin portal
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.portal == 'true') }}
    runs-on: ubuntu-latest

    # The portal is how the mobile team signs in as a role, inspects a token and
    # reproduces a failing call, so a broken build costs four people their tooling.
    # Its tests cover the three pieces whose failure is confusing rather than obvious:
    # JWT decoding, the auth interceptor and ApiError parsing.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `version:` here on purpose. The action refuses to run when it is told a version AND
      # finds `packageManager` in package.json - "Multiple versions of pnpm specified" - and the
      # root package.json pins pnpm@10.33.0. One source of truth, and it is the one the
      # Dockerfile and everybody's laptop already use through Corepack.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: app/frontend/web-admin/pnpm-lock.yaml

      # --frozen-lockfile so a lockfile that drifted from package.json fails here rather
      # than silently resolving different versions than anyone tested against.
      - name: Install
        working-directory: app/frontend/web-admin
        run: pnpm install --frozen-lockfile

      # Vitest on jsdom, so no browser is needed. `pnpm test` regenerates the bundled
      # OpenAPI JSON first: the API console imports those as modules, so a spec change
      # that breaks the parser fails here instead of in someone's browser.
      - name: Test
        working-directory: app/frontend/web-admin
        run: pnpm test

      # Building is a real check, not a formality: the portal is served as static files
      # from nginx, so a template or type error only surfaces at build time.
      - name: Build
        working-directory: app/frontend/web-admin
        run: pnpm build
