name: Conventions

on:
  pull_request:
    branches: [main, develop]
    # A separate workflow from ci.yml so that correcting a title or retargeting a stacked pull request
    # re-runs this check in seconds, without rebuilding seven services. labeled and unlabeled re-run it
    # when the area label is added after opening.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  # Git conventions is required, so it has to report on the merge queue's branch too. There it passes at
  # once: the queue holds pull requests that already passed it, and its branch has no title or labels.
  merge_group:

permissions:
  contents: read

concurrency:
  group: conventions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  git:
    # Required by the main and develop rulesets. Renaming this job silently un-requires it.
    name: Git conventions
    runs-on: ubuntu-latest

    steps:
      # Full history: the check walks every commit between the base and the head of the pull request.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Everything from the event goes through env, never through ${{ }} inside run: a pull request
      # title is text anyone opening a pull request controls, and interpolating it is a shell injection.
      - name: Check branch, title and commits
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = merge_group ]; then
            echo "merge queue: every pull request in it already passed this check"
            exit 0
          fi
          status=0
          # Every pull request names its area, so each chat and person can filter the list by it
          # (AGENTS.md). Dependabot's come labelled from .github/dependabot.yml.
          case " $LABELS " in
            *" area/kotlin "* | *" area/swift "* | *" area/backend "* | *" area/docs "*) ;;
            *) echo "error: the pull request has no area label. Add one of area/kotlin, area/swift, area/backend or area/docs."
               status=1 ;;
          esac
          bash scripts/check-git-conventions.sh branch "$HEAD_REF" "$BASE_REF" || status=1
          # Dependabot writes its own commits and nobody can reword them. The title is still checked,
          # because squash merging turns it into the commit that stays on develop, but its length only
          # warns: Dependabot names the whole directory, and a weekly hand edit would be the only fix.
          case $HEAD_REF in
            dependabot/*) LONG_SUBJECT=warn bash scripts/check-git-conventions.sh title "$PR_TITLE" || status=1 ;;
            *) bash scripts/check-git-conventions.sh title "$PR_TITLE" || status=1 ;;
          esac
          # A release carries every commit develop gathered since the last one. Those were checked by
          # their own pull requests, and some predate this check (#24 kept a trailer that develop can
          # no longer drop), so only the release's own commits are checked on the way to main.
          case $HEAD_REF in
            dependabot/*) echo "commits skipped: written by Dependabot" ;;
            release/*) bash scripts/check-git-conventions.sh range origin/develop "$HEAD_SHA" || status=1 ;;
            *) bash scripts/check-git-conventions.sh range "$BASE_SHA" "$HEAD_SHA" || status=1 ;;
          esac
          exit "$status"

  contributing:
    # Deliberately NOT required: a change to the organization's guide would otherwise block every open
    # pull request here until someone syncs. The red mark on the pull request is the reminder.
    name: CONTRIBUTING in sync
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare with the organization's canonical guide
        run: |
          curl -fsSL https://raw.githubusercontent.com/K-Forge/.github/main/CONTRIBUTING.md -o "$RUNNER_TEMP/canonical.md"
          if ! diff -u "$RUNNER_TEMP/canonical.md" CONTRIBUTING.md; then
            echo "::error file=CONTRIBUTING.md::CONTRIBUTING.md differs from K-Forge/.github. Run scripts/sync-contributing.sh and commit the result."
            exit 1
          fi
