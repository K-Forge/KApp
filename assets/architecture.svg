<text x="620.0" y="580" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#5F6E6A" text-anchor="middle">writing to SINU · grades · enrolment · payments · chat</text>
<text x="28" y="622" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#5F6E6A" text-anchor="start">Every service validates the access token itself against the published JWKS —</text>
<text x="28" y="640" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#5F6E6A" text-anchor="start">no service trusts a header the gateway sets. Four OpenFeign edges, kept few on purpose:</text>
<text x="28" y="658" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#5F6E6A" text-anchor="start">auth → user, user → auth, schedule → semaphore, schedule → map.</text>
